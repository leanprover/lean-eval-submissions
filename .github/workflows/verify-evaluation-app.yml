name: Verify staging evaluation App

on:
  workflow_dispatch:
    inputs:
      expected_branch:
        description: 'Exact private fixture branch to verify'
        required: true
        type: string
      expected_commit:
        description: 'Exact private fixture commit to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evaluation-app-preflight-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-staging
    steps:
      - name: Mint lean-eval-bot installation token for the fixed fixture
        id: app-token
        # actions/create-github-app-token pinned to v3.2.0.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}
          owner: leanprover
          repositories: lean-eval-state-staging

      - name: Verify exact private fixture and frozen source commit
        env:
          APP_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_BRANCH" =~ ^[A-Za-z0-9._/-]{1,128}$ ]] || \
             [[ "$EXPECTED_BRANCH" == /* || "$EXPECTED_BRANCH" == */ || \
                "$EXPECTED_BRANCH" == *..* ]]; then
            echo "expected branch is not canonical" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected commit is not a full lowercase Git SHA" >&2
            exit 1
          fi
          metadata_file=$(mktemp)
          branch_file=$(mktemp)
          commit_file=$(mktemp)
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${APP_INSTALLATION_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$metadata_file" \
            https://api.github.com/repos/leanprover/lean-eval-state-staging
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${APP_INSTALLATION_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$branch_file" \
            "https://api.github.com/repos/leanprover/lean-eval-state-staging/git/ref/heads/${EXPECTED_BRANCH}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${APP_INSTALLATION_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$commit_file" \
            "https://api.github.com/repos/leanprover/lean-eval-state-staging/git/commits/${EXPECTED_COMMIT}"
          METADATA_FILE="$metadata_file" BRANCH_FILE="$branch_file" \
            COMMIT_FILE="$commit_file" EXPECTED_BRANCH="$EXPECTED_BRANCH" \
            EXPECTED_COMMIT="$EXPECTED_COMMIT" python3 - <<'PY'
          import json
          import os

          with open(os.environ["METADATA_FILE"], encoding="utf-8") as stream:
              metadata = json.load(stream)
          with open(os.environ["BRANCH_FILE"], encoding="utf-8") as stream:
              branch = json.load(stream)
          with open(os.environ["COMMIT_FILE"], encoding="utf-8") as stream:
              commit = json.load(stream)
          assert metadata["full_name"] == "leanprover/lean-eval-state-staging"
          assert metadata["private"] is True
          assert branch["ref"] == f"refs/heads/{os.environ['EXPECTED_BRANCH']}"
          assert branch["object"] == {
              "sha": os.environ["EXPECTED_COMMIT"],
              "type": "commit",
              "url": branch["object"]["url"],
          }
          assert commit["sha"] == os.environ["EXPECTED_COMMIT"]
          print("lean-eval-bot can read the exact private fixture branch and commit")
          PY
