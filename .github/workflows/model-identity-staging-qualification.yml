name: Model identity dark staging qualification (source-disabled)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact protected-main commit deployed to staging
        required: true
        type: string
      initial_state_commit:
        description: Exact staging State head before qualification
        required: true
        type: string
      initial_state_tree:
        description: Exact complete tree of the initial staging State head
        required: true
        type: string
      owner_login:
        description: Exact lowercase owner login shared by OAuth and agent sessions
        required: true
        type: string
      owner_github_id:
        description: Exact positive numeric owner account ID
        required: true
        type: string
      cross_owner_login:
        description: Exact lowercase distinct owner login used for denial
        required: true
        type: string
      cross_owner_github_id:
        description: Exact positive numeric distinct owner account ID
        required: true
        type: string
      maintainer_login:
        description: Exact lowercase maintainer login used for decisions
        required: true
        type: string
      maintainer_github_id:
        description: Exact positive numeric maintainer account ID
        required: true
        type: string
      confirm:
        description: Type QUALIFY_AND_RESTORE_MODEL_IDENTITY_STAGING
        required: true
        type: string

permissions: {}

concurrency:
  group: model-identity-staging-qualification
  cancel-in-progress: false

# IMMUTABLE SOURCE SAFETY GATE: GitHub never emits the deliberately impossible
# refs/source-disabled/... value below. A later reviewed commit may arm these
# jobs only after the staging-only journaled harness, automatic recovery,
# environment reviewers, and ephemeral credentials exist. Installing secrets or
# deploying a route cannot arm this source.
jobs:
  authorize:
    if: ${{ github.repository == 'leanprover/lean-eval-submissions' && github.ref == 'refs/source-disabled/model-identity-qualification' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
    steps:
      - id: guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          INITIAL_STATE_COMMIT: ${{ inputs.initial_state_commit }}
          INITIAL_STATE_TREE: ${{ inputs.initial_state_tree }}
          OWNER_GITHUB_ID: ${{ inputs.owner_github_id }}
          CROSS_OWNER_GITHUB_ID: ${{ inputs.cross_owner_github_id }}
          MAINTAINER_GITHUB_ID: ${{ inputs.maintainer_github_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "leanprover/lean-eval-submissions"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "kim-em"
          test "$TRIGGERING_ACTOR" = "kim-em"
          test "$ACTOR_ID" = "477956"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INITIAL_STATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INITIAL_STATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OWNER_GITHUB_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CROSS_OWNER_GITHUB_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MAINTAINER_GITHUB_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$OWNER_GITHUB_ID" != "$CROSS_OWNER_GITHUB_ID"
          test "$CONFIRM" = "QUALIFY_AND_RESTORE_MODEL_IDENTITY_STAGING"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"

  qualify-and-restore:
    if: ${{ github.repository == 'leanprover/lean-eval-submissions' && github.ref == 'refs/source-disabled/model-identity-qualification' }}
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloudflare-staging
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ needs.authorize.outputs.commit }}
      INITIAL_STATE_COMMIT: ${{ inputs.initial_state_commit }}
      INITIAL_STATE_TREE: ${{ inputs.initial_state_tree }}
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}

      - name: Run journaled dark lifecycle and mandatory restoration
        env:
          MODEL_IDENTITY_AGENT_SESSION: ${{ secrets.MODEL_IDENTITY_AGENT_SESSION }}
          MODEL_IDENTITY_CROSS_OWNER_SESSION: ${{ secrets.MODEL_IDENTITY_CROSS_OWNER_SESSION }}
          MODEL_IDENTITY_MAINTAINER_SESSION: ${{ secrets.MODEL_IDENTITY_MAINTAINER_SESSION }}
          MODEL_IDENTITY_OAUTH_SESSION: ${{ secrets.MODEL_IDENTITY_OAUTH_SESSION }}
          MODEL_IDENTITY_QUALIFICATION_TOKEN: ${{ secrets.MODEL_IDENTITY_QUALIFICATION_TOKEN }}
          OWNER_LOGIN: ${{ inputs.owner_login }}
          OWNER_GITHUB_ID: ${{ inputs.owner_github_id }}
          CROSS_OWNER_LOGIN: ${{ inputs.cross_owner_login }}
          CROSS_OWNER_GITHUB_ID: ${{ inputs.cross_owner_github_id }}
          MAINTAINER_LOGIN: ${{ inputs.maintainer_login }}
          MAINTAINER_GITHUB_ID: ${{ inputs.maintainer_github_id }}
        run: |
          set -euo pipefail
          python3 scripts/run_model_identity_staging_qualification.py qualify \
            --expected-commit "$EXPECTED_COMMIT" \
            --initial-state-commit "$INITIAL_STATE_COMMIT" \
            --initial-state-tree "$INITIAL_STATE_TREE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --owner "$OWNER_GITHUB_ID:$OWNER_LOGIN" \
            --cross-owner "$CROSS_OWNER_GITHUB_ID:$CROSS_OWNER_LOGIN" \
            --maintainer "$MAINTAINER_GITHUB_ID:$MAINTAINER_LOGIN" \
            --evidence "$RUNNER_TEMP/model-identity-qualification-evidence.json" \
            --confirm "QUALIFY_AND_RESTORE_MODEL_IDENTITY_STAGING"

      # actions/upload-artifact pinned to v4.6.2.
      - name: Preserve source-free qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-identity-staging-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-identity-qualification-evidence.json
          if-no-files-found: error
          retention-days: 90
