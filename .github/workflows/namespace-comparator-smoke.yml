name: Namespace submission runner smoke

on:
  push:
    branches: [experiment/namespace-comparator-smoke]

permissions:
  contents: read

jobs:
  solution-dependency-sandbox:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-16x32-with-features
      - namespace-features:container.privileged=true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create toolchain setup package
        run: |
          mkdir -p .ci/solution-dependencies
          printf '%s\n' 'leanprover/lean4:v4.35.0-rc3' > .ci/solution-dependencies/lean-toolchain
          printf '%s\n' 'name = "solution-dependency-test"' > .ci/solution-dependencies/lakefile.toml
          printf '%s\n' '{"version":"1.2.0","packagesDir":".lake/packages","packages":[],"name":"solution-dependency-test","lakeDir":".lake"}' > .ci/solution-dependencies/lake-manifest.json

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: .ci/solution-dependencies
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Install pinned bubblewrap
        id: bwrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build libcap-dev
          bash scripts/install_bwrap.sh "$RUNNER_TEMP/lean-eval-bwrap"
          echo "path=$RUNNER_TEMP/lean-eval-bwrap/bwrap" >> "$GITHUB_OUTPUT"

      - name: Test sandboxed imports with cold shared dependencies
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.35.0-rc3
          COMPARATOR_BWRAP: ${{ steps.bwrap.outputs.path }}
          LEAN_EVAL_SANDBOX_TEST: '1'
        run: python3 -m unittest discover -v -s tests -p test_solution_dependency_sandbox.py
