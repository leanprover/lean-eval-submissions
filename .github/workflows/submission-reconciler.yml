# Safety net for the Submission workflow: if an issue is labeled
# `submission` but no bot comment has appeared within 7 hours, post a
# generic orphan-notice and close. Catches cases the in-workflow
# handlers cannot:
#   - workflow administratively disabled (run conclusion = skipped)
#   - workflow file has a syntax error / never dispatches
#   - runner died before the `if: failure()` step ran in `fetch`
#   - the `notify` job itself failed
#
# 7h threshold > evaluate's 6h GitHub-runner job limit, so legitimate
# long runs are not closed prematurely.
name: Submission reconciler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Reconcile orphaned submission issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: python scripts/reconcile_orphan_submissions.py
