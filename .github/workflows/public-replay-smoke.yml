name: Weil public source diagnostic

# Branch-only operator run of public source. No State, Results, or release writes.
on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: Runner for this pinned public-source attempt
        type: choice
        default: namespace
        options: [namespace, christian]

permissions:
  contents: read

concurrency:
  group: weil-public-source-diagnostic-${{ inputs.runner_target }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ${{ fromJSON(inputs.runner_target == 'christian' && '["self-hosted","Linux","X64","lean-eval-weil"]' || '["nscloud-ubuntu-24.04-amd64-32x64-with-features","namespace-features:container.privileged=true"]') }}
    timeout-minutes: 1440
    env:
      SOURCE_REPOSITORY: formal-arithmetic-geometry/weil-conjectures
      SOURCE_COMMIT: 68900a4574c3b86ccb7c9a3a6b88b6fe7a61162e
      BENCHMARK_COMMIT: 85a88c37f80170d9f08651dc63ce6b81a8a48cb9
      EXPECTED_TOOLCHAIN: leanprover/lean4:v4.35.0-rc3
    steps:
      - name: Set evaluation deadline
        id: deadline
        run: echo "epoch=$(($(date +%s) + 1410 * 60))" >> "$GITHUB_OUTPUT"

      - name: Inspect allocated resources
        run: |
          nproc
          free -h
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval
          ref: 85a88c37f80170d9f08651dc63ce6b81a8a48cb9
          path: lean-eval
          persist-credentials: false

      - name: Require anonymously public source
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --max-time 30 "https://api.github.com/repos/$SOURCE_REPOSITORY" \
            > /tmp/weil-public-repository.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/weil-public-repository.json') as stream:
              repository = json.load(stream)
          assert repository['full_name'] == os.environ['SOURCE_REPOSITORY']
          assert repository['private'] is False
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: formal-arithmetic-geometry/weil-conjectures
          ref: 68900a4574c3b86ccb7c9a3a6b88b6fe7a61162e
          path: source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify and retain immutable identities
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C lean-eval rev-parse HEAD)" = "$BENCHMARK_COMMIT"
          test "$(cat lean-eval/lean-toolchain)" = "$EXPECTED_TOOLCHAIN"
          mkdir -p /tmp/weil-evaluate-out
          python - <<'PY'
          import json, os, pathlib
          identity = {key.lower(): os.environ[key] for key in (
              'SOURCE_REPOSITORY', 'SOURCE_COMMIT', 'BENCHMARK_COMMIT', 'EXPECTED_TOOLCHAIN',
          )}
          identity.update(workflow_commit=os.environ['GITHUB_SHA'], diagnostic_only=True)
          pathlib.Path('/tmp/weil-evaluate-out/identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        if: inputs.runner_target != 'christian'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Strip checkout Git metadata before any untrusted Lean runs
        run: rm -rf .git lean-eval/.git source/.git

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: lean-eval
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Build trusted Mathlib tactic absent from its published cache
        # TauCeti's cache-only restore depends on this uncached Mathlib module.
        # Build only this pinned Mathlib target, before restoring TauCeti.
        working-directory: lean-eval
        run: lake build Mathlib.Tactic.CategoryTheory.BicategoryCoherence

      - name: Build the benchmark root with downloaded dependency caches
        run: python scripts/build_benchmark_root.py lean-eval

      - name: Install bubblewrap for Lake comparator
        id: bwrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config meson ninja-build libcap-dev apparmor
          bash scripts/install_bwrap.sh "$RUNNER_TEMP/lean-eval-bwrap"
          echo "path=$RUNNER_TEMP/lean-eval-bwrap/bwrap" >> "$GITHUB_OUTPUT"

      - name: Probe sandbox is engaged
        env:
          COMPARATOR_BWRAP: ${{ steps.bwrap.outputs.path }}
        run: python lean-eval/scripts/sandbox_engaged_probe.py --require-tools

      - name: Probe env-var allowlist
        env:
          COMPARATOR_BWRAP: ${{ steps.bwrap.outputs.path }}
        run: python lean-eval/scripts/security_probes/env_dump_probe.py --require-tools

      - name: Evaluate the exact public Weil workspace
        env:
          COMPARATOR_BWRAP: ${{ steps.bwrap.outputs.path }}
        run: |
          python scripts/run_with_resource_report.py \
            --deadline '${{ steps.deadline.outputs.epoch }}' \
            --summary /tmp/weil-evaluate-out/summary.json \
            --report /tmp/weil-evaluate-out/resource-report.json -- \
            python scripts/evaluate_submission.py \
              --source-dir source \
              --generated-root lean-eval/generated \
              --manifest-dir lean-eval/manifests/problems \
              --repo-root lean-eval \
              --shared-packages lean-eval/.lake/packages \
              --problem-id weil_conjectures --statement-revision 1 \
              --acceptance-metrics-dir /tmp/weil-acceptance-metrics \
              --output-dir /tmp/weil-evaluate-out

      - name: Upload source-free diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: weil-public-source-diagnostic
          path: /tmp/weil-evaluate-out/*.json
          if-no-files-found: error
          retention-days: 7
