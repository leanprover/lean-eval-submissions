# TEMPORARY. Checks leanprover/comparator#78 (PID-namespace containment of
# sandbox descendants) against the two runner types lean-eval can reach.
#
# #78 runs each landrun invocation as PID 1 of a fresh user + PID + mount
# namespace. Unprivileged user namespaces are restricted on Ubuntu 24.04,
# and #78's own CI works around that with
# `sysctl -w kernel.apparmor_restrict_unprivileged_userns=0`. This measures
# what actually happens on our runners with and without that sysctl, since
# lean-eval-submissions would have to adopt the same workaround.
name: comparator PR78 check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, nscloud-ubuntu-24.04-amd64-32x64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Baseline
        run: |
          set +e
          uname -a
          echo "--- apparmor userns knob ---"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1 || echo "(knob absent)"
          echo "--- unprivileged userns available? ---"
          unshare -Ur --map-root-user true; echo "unshare -Ur exit=$?"

      - name: Check out comparator PR 78
        run: |
          git clone -q https://github.com/leanprover/comparator.git comparator
          cd comparator
          git fetch -q origin pull/78/head:pr78
          git checkout -q pr78
          git log --oneline -1

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install landrun
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build comparator and lean4export
        run: |
          git clone -q https://github.com/leanprover/lean4export.git lean4export
          cp comparator/lean-toolchain lean4export/lean-toolchain
          (cd lean4export && lake build)
          (cd comparator && lake build comparator)
          echo "$PWD/lean4export/.lake/build/bin" >> "$GITHUB_PATH"
          echo "$PWD/comparator/.lake/build/bin" >> "$GITHUB_PATH"

      # The question that matters for lean-eval: does #78 work as shipped,
      # before anyone relaxes a kernel hardening control?
      - name: descendant_cleanup WITHOUT the sysctl workaround
        run: |
          set +e
          cd comparator
          lean --run runtests.lean descendant_cleanup 2>&1 | tail -25
          echo "EXIT=${PIPESTATUS[0]}"

      - name: Apply #78's CI workaround
        run: |
          set +e
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            echo "sysctl exit=$?"
          else
            echo "knob absent, nothing to relax"
          fi
          unshare -Ur --map-root-user true; echo "unshare -Ur now exit=$?"

      - name: descendant_cleanup WITH the sysctl workaround
        run: |
          set +e
          cd comparator
          lean --run runtests.lean descendant_cleanup 2>&1 | tail -25
          echo "EXIT=${PIPESTATUS[0]}"

      # A submission that can create user namespaces has more kernel surface
      # to attack than one that cannot. Record whether relaxing the control
      # to gain containment also hands that to the payload.
      - name: Does the relaxation also reach unprivileged callers?
        run: |
          set +e
          unshare -Urm true; echo "unshare -Urm exit=$? (0 means any process here can now do this)"
