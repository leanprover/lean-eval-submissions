name: Verify State writer

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Worker environment whose stored State credential should be verified
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: state-writer-preflight-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-${{ inputs.target_environment }}
    permissions:
      contents: read
    env:
      READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify stored credential and ruleset bypass without changing State
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/readyz"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/readyz"
              ;;
            *)
              echo "unsupported target environment"
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          curl --fail-with-body --silent --show-error --proto '=https' \
            --max-redirs 0 --max-time 20 --retry 2 --retry-all-errors \
            --retry-max-time 45 \
            --request POST \
            --header "Authorization: Bearer ${READINESS_TOKEN}" \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload["status"] != "state_writer_ready":
              raise SystemExit("State writer preflight did not report ready")
          if payload["environment"] != os.environ["TARGET_ENVIRONMENT"]:
              raise SystemExit("State writer preflight reached the wrong environment")
          if type(payload["intake_enabled"]) is not bool:
              raise SystemExit("State writer preflight returned an invalid intake state")
          if payload.get("intake_configured_enabled") is not payload["intake_enabled"]:
              raise SystemExit("configured and effective intake state differ unexpectedly")
          if payload.get("intake_effective_enabled") is not payload["intake_enabled"]:
              raise SystemExit("effective and compatibility intake state differ")
          expected_mode = "durable" if payload["intake_enabled"] else "disabled"
          if payload.get("intake_enablement_mode") != expected_mode:
              raise SystemExit("State writer preflight returned an unexpected intake mode")
          if payload.get("intake_lease_expires_at") is not None:
              raise SystemExit("ordinary State writer verification found a temporary lease")
          if re.fullmatch(r"[0-9a-f]{40}", payload["state_commit"]) is None:
              raise SystemExit("State writer preflight returned an invalid commit")
          intake_state = "enabled" if payload["intake_enabled"] else "disabled"
          print(
              f"State writer ready at {payload['state_commit']}; "
              f"intake is {intake_state}"
          )
          PY
