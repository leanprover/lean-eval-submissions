name: Migrate historical archive envelopes

on:
  workflow_dispatch:
    inputs:
      audit_commit:
        description: Exact reviewed lean-eval-audit main commit
        required: true
        type: string
      expected_inventory_digest:
        description: Freshly reviewed migration inventory digest
        required: true
        type: string
      expected_migration_count:
        description: Exact number of shared-recipient objects
        required: true
        type: string
      apply:
        description: Build and push the isolated migration review branch
        required: true
        type: boolean
        default: false
      confirmation:
        description: For apply, enter stage-envelope-migration
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lean-eval-historical-archive-envelope-migration
  cancel-in-progress: false

jobs:
  authorize-manual:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require an upstream protected-main dispatch
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = leanprover/lean-eval-submissions
          test "$EVENT_REF" = refs/heads/main

  migrate:
    needs: authorize-manual
    environment: archive-migration-production
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Check out the exact private audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-audit
          ref: ${{ inputs.audit_commit }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.AUDIT_MIGRATION_READ_KEY }}

      - name: Freeze and verify the complete inventory
        id: inventory
        env:
          AUDIT_COMMIT: ${{ inputs.audit_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_inventory_digest }}
          EXPECTED_COUNT: ${{ inputs.expected_migration_count }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]
          test "$(git -C audit rev-parse HEAD)" = "$AUDIT_COMMIT"
          python scripts/migrate_archive_envelopes.py inventory \
            --audit-root audit \
            --source-commit "$AUDIT_COMMIT" \
            --output "$RUNNER_TEMP/archive-migration-plan.json"
          actual_digest=$(jq -r .inventory_digest "$RUNNER_TEMP/archive-migration-plan.json")
          actual_count=$(jq -r .migration_count "$RUNNER_TEMP/archive-migration-plan.json")
          test "$actual_digest" = "$EXPECTED_DIGEST"
          test "$actual_count" = "$EXPECTED_COUNT"
          {
            echo "digest=$actual_digest"
            echo "count=$actual_count"
            echo "retained=$(jq -r .retained_count "$RUNNER_TEMP/archive-migration-plan.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Require explicit apply confirmation and legacy identity
        if: inputs.apply == true
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          LEGACY_ARCHIVE_IDENTITY: ${{ secrets.LEGACY_ARCHIVE_IDENTITY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = stage-envelope-migration
          test -n "$LEGACY_ARCHIVE_IDENTITY"
          umask 077
          printf '%s' "$LEGACY_ARCHIVE_IDENTITY" > /dev/shm/lean-eval-legacy-archive-identity
          test -s /dev/shm/lean-eval-legacy-archive-identity

      - name: Mint audit-repository-only migration writer
        if: inputs.apply == true
        id: audit_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.LEAN_EVAL_ARCHIVER_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_ARCHIVER_PRIVATE_KEY }}
          owner: leanprover
          repositories: lean-eval-audit

      - name: Re-check out the exact audit source with branch-staging authority
        if: inputs.apply == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-audit
          ref: ${{ inputs.audit_commit }}
          path: audit
          fetch-depth: 1
          persist-credentials: true
          token: ${{ steps.audit_token.outputs.token }}

      - name: Install hash-locked adapter dependencies
        if: inputs.apply == true
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python -m pip install --disable-pip-version-check --require-hashes \
            -r infrastructure/aws-key-adapter/requirements-workflow.txt

      - name: Install checksum-pinned age 1.3.1
        if: inputs.apply == true
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $RUNNER_TEMP/age.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/age.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/age/age" --version)" = v1.3.1
          rm -f "$RUNNER_TEMP/age.tar.gz"

      - name: Assume only the production Encrypt role
        if: inputs.apply == true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_WRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: lean-eval-historical-envelope-migration
          mask-aws-account-id: true

      - name: Re-encrypt every planned object into a clean tree
        if: inputs.apply == true
        env:
          LEAN_EVAL_KMS_KEY_ID: alias/lean-eval-archive-identities-production
          LEAN_EVAL_ADAPTER_NAME: aws-kms-v1
        run: |
          set -euo pipefail
          cleanup() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
            {
              echo 'AWS_ACCESS_KEY_ID='
              echo 'AWS_SECRET_ACCESS_KEY='
              echo 'AWS_SESSION_TOKEN='
              echo 'ACTIONS_ID_TOKEN_REQUEST_TOKEN='
              echo 'ACTIONS_ID_TOKEN_REQUEST_URL='
            } >> "$GITHUB_ENV"
            rm -f /dev/shm/lean-eval-legacy-archive-identity
          }
          trap cleanup EXIT
          output_root="$RUNNER_TEMP/migrated-audit"
          python scripts/migrate_archive_envelopes.py seed-retained \
            --plan "$RUNNER_TEMP/archive-migration-plan.json" \
            --source-root audit \
            --output-root "$output_root"
          jq -r '.entries[].source_path' "$RUNNER_TEMP/archive-migration-plan.json" \
            | while IFS= read -r source_path; do
                python scripts/migrate_archive_envelopes.py migrate-one \
                  --plan "$RUNNER_TEMP/archive-migration-plan.json" \
                  --source-root audit \
                  --output-root "$output_root" \
                  --legacy-identity /dev/shm/lean-eval-legacy-archive-identity \
                  --adapter-executable scripts/aws_key_adapter.py \
                  --source-path "$source_path"
              done
          cleanup
          trap - EXIT
          python scripts/migrate_archive_envelopes.py validate-output \
            --plan "$RUNNER_TEMP/archive-migration-plan.json" \
            --output-root "$output_root" \
            --output "$RUNNER_TEMP/archive-migration-report.json"

      - name: Push only an isolated orphan review branch
        if: inputs.apply == true
        env:
          INVENTORY_DIGEST: ${{ steps.inventory.outputs.digest }}
        run: |
          set -euo pipefail
          git -C audit switch --orphan archive-envelope-migration-v1
          git -C audit rm -rf --ignore-unmatch .
          cp -a "$RUNNER_TEMP/migrated-audit/." audit/
          cp "$RUNNER_TEMP/archive-migration-plan.json" audit/migration-plan-v1.json
          cp "$RUNNER_TEMP/archive-migration-report.json" audit/migration-report-v1.json
          git -C audit config user.name lean-eval-archiver
          git -C audit config user.email lean-eval-archiver@users.noreply.github.com
          git -C audit add .
          git -C audit diff --cached --check
          test "$(git -C audit ls-files '*.tar.age' | wc -l)" = \
            "$(( ${{ steps.inventory.outputs.count }} + ${{ steps.inventory.outputs.retained }} ))"
          git -C audit commit -m "migration: stage per-submission archive envelopes"
          git -C audit push origin HEAD:refs/heads/archive-envelope-migration-v1
          {
            echo '### Historical archive migration branch staged'
            echo
            echo "- source audit commit: \`${{ inputs.audit_commit }}\`"
            echo "- inventory digest: \`$INVENTORY_DIGEST\`"
            echo "- review branch commit: \`$(git -C audit rev-parse HEAD)\`"
            echo '- no audit main ref was changed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record source-free dry-run evidence
        if: inputs.apply == false
        run: |
          {
            echo '### Historical archive migration dry run passed'
            echo
            echo "- source audit commit: \`${{ inputs.audit_commit }}\`"
            echo "- migration count: \`${{ steps.inventory.outputs.count }}\`"
            echo "- retained schema-version-3 count: \`${{ steps.inventory.outputs.retained }}\`"
            echo "- inventory digest: \`${{ steps.inventory.outputs.digest }}\`"
            echo '- no identity, AWS role, plaintext, artifact, branch, or audit write was used'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove migration scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/migrated-audit" "$RUNNER_TEMP/age"
          rm -f "$RUNNER_TEMP/archive-migration-plan.json" \
            "$RUNNER_TEMP/archive-migration-report.json" \
            /dev/shm/lean-eval-legacy-archive-identity
