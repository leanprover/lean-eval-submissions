name: Synthetic runner handoff attempt
on:
  workflow_call:
    inputs:
      tier: {type: string, required: true}
    outputs:
      succeeded:
        value: ${{ jobs.evaluate.outputs.succeeded }}
jobs:
  evaluate:
    continue-on-error: true
    runs-on:
      - ${{ inputs.tier == 'large' && 'nscloud-ubuntu-24.04-amd64-32x64-with-features' || 'nscloud-ubuntu-24.04-amd64-16x32-with-features' }}
      - namespace-features:container.privileged=true
    timeout-minutes: 5
    outputs:
      succeeded: ${{ steps.outcome.outputs.succeeded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Report actual resources
        run: |
          nproc
          free -g
      - name: Run evaluate_submission.py
        env:
          TIER: ${{ inputs.tier }}
        run: |
          if [ "$TIER" = standard ]; then
            python scripts/run_with_resource_report.py --deadline "$(($(date +%s) + 2))" --report /tmp/out/resource-report.json -- \
              python -c 'import time; time.sleep(90)'
          else
            python scripts/run_with_resource_report.py --report /tmp/out/resource-report.json -- \
              python -c 'print("controlled larger attempt completed")'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: submission-results-${{ inputs.tier }}
          path: /tmp/out/resource-report.json
      - name: Record attempt outcome
        id: outcome
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then
            echo 'succeeded=true' >> "$GITHUB_OUTPUT"
          else
            echo 'succeeded=false' >> "$GITHUB_OUTPUT"
          fi
