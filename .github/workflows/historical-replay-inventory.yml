name: Build historical replay inventory

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full protected-main commit selected through its immutable dispatch tag
        required: true
        type: string
      expected_results_store_sha256:
        description: Reviewed canonical results-store digest
        required: true
        type: string
      expected_result_count:
        description: Reviewed accepted-result count
        required: true
        type: string
      expected_baseline_inventory_sha256:
        description: Exact committed baseline inventory digest; required only for append-only delta proof
        required: false
        type: string
        default: bb405fbabe084e106ad5500b455a05ba1e1d54175d1964db3aebcc3b6ea3fce3
      confirm_append_only_delta:
        description: Also prove the append-only delta from the committed 1,301-result baseline
        required: true
        type: boolean
        default: false
      confirm_contract_only:
        description: Build a source-minimized inventory without replay, State writes, or publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: historical-replay-inventory
  cancel-in-progress: false

env:
  INVENTORY_SCHEMA: schemas/historical-replay-inventory-v1.schema.json
  DELTA_SCHEMA: schemas/historical-replay-inventory-delta-v1.schema.json
  BASELINE_INVENTORY: evidence/historical-replay/inventories/bb405fbabe084e106ad5500b455a05ba1e1d54175d1964db3aebcc3b6ea3fce3.json
  MAX_INVENTORY_BYTES: '16777216'

jobs:
  inventory:
    if: inputs.confirm_contract_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the exact immutable protected dispatch tag
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "leanprover/lean-eval-submissions"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = "refs/tags/lean-eval-dispatch/$EXPECTED_COMMIT"
          tag_ref="refs/tags/lean-eval-dispatch/$EXPECTED_COMMIT"
          mapfile -t tag_lines < <(timeout 30s git ls-remote \
            https://github.com/leanprover/lean-eval-submissions.git \
            "$tag_ref" "$tag_ref^{}")
          test "${#tag_lines[@]}" -ge 1
          test "${#tag_lines[@]}" -le 2
          tag_object=""
          remote_commit=""
          for line in "${tag_lines[@]}"; do
            read -r object ref extra <<< "$line"
            test -z "${extra:-}"
            [[ "$object" =~ ^[0-9a-f]{40}$ ]]
            if [ "$ref" = "$tag_ref" ]; then
              test -z "$tag_object"
              tag_object="$object"
            elif [ "$ref" = "$tag_ref^{}" ]; then
              test -z "$remote_commit"
              remote_commit="$object"
            else
              exit 1
            fi
          done
          test -n "$tag_object"
          if [ -z "$remote_commit" ]; then remote_commit="$tag_object"; fi
          test "$remote_commit" = "$EXPECTED_COMMIT"

      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected main and the exact clean source checkout
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main=$(timeout 30s git ls-remote \
            https://github.com/leanprover/lean-eval-submissions.git \
            refs/heads/main | cut -f1)
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          branch=$(timeout 30s gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '[.name, .commit.sha, .protected] | @tsv')
          test "$branch" = $'main\t'"$remote_main"$'\ttrue'
          test "$(git rev-parse origin/main)" = "$remote_main"
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -d results
          test ! -L results

      # actions/setup-python pinned to v7.0.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Install pinned inventory schema validator
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-jsonschema-workflow.txt

      - name: Build and independently recompute the source-free inventory
        id: inventory
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_COUNT: ${{ inputs.expected_result_count }}
          EXPECTED_DIGEST: ${{ inputs.expected_results_store_sha256 }}
          EXPECTED_BASELINE_INVENTORY_SHA256: ${{ inputs.expected_baseline_inventory_sha256 }}
          CONFIRM_DELTA: ${{ inputs.confirm_append_only_delta }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_COUNT" -le 10000
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact="$RUNNER_TEMP/historical-replay-inventory.json"
          recomputed="$RUNNER_TEMP/historical-replay-inventory.recomputed.json"
          python scripts/inventory_historical_replay.py \
            --results-root results \
            --source-commit "$EXPECTED_COMMIT" \
            --output "$artifact"
          python scripts/inventory_historical_replay.py \
            --results-root results \
            --source-commit "$EXPECTED_COMMIT" \
            --output "$recomputed"
          cmp "$artifact" "$recomputed"
          ARTIFACT="$artifact" python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          from jsonschema import Draft202012Validator, FormatChecker

          path = pathlib.Path(os.environ["ARTIFACT"])
          assert 0 < path.stat().st_size <= int(os.environ["MAX_INVENTORY_BYTES"])
          raw = path.read_bytes()
          value = json.loads(raw)
          schema = json.loads(pathlib.Path(os.environ["INVENTORY_SCHEMA"]).read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(value), key=lambda error: list(error.path))
          assert not errors, errors
          assert set(value) == {
              "schema_version",
              "source_repository",
              "source_commit",
              "results_store_sha256",
              "result_count",
              "classification_counts",
              "entries",
          }
          assert value["schema_version"] == 1
          assert value["source_repository"] == "leanprover/lean-eval-submissions"
          assert value["source_commit"] == os.environ["EXPECTED_COMMIT"]
          assert value["results_store_sha256"] == os.environ["EXPECTED_DIGEST"]
          assert str(value["result_count"]) == os.environ["EXPECTED_COUNT"]
          counts = value["classification_counts"]
          assert set(counts) == {
              "public_source_probe_pending",
              "private_archive_migration_pending",
          }
          assert sum(counts.values()) == value["result_count"]
          entries = value["entries"]
          identities = [entry["result_id"] for entry in entries]
          assert len(entries) == value["result_count"]
          assert identities == sorted(set(identities))
          for entry in entries:
              source = entry["source"]
              if source["visibility"] == "private":
                  assert set(source) == {"kind", "visibility", "readiness"}
                  assert source["readiness"] == "private_archive_migration_pending"
              else:
                  assert source["visibility"] == "public"
                  assert set(source) == {
                      "kind", "visibility", "readiness", "repository", "commit"
                  }
                  assert source["readiness"] == "public_source_probe_pending"
          canonical = (
              json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          assert raw == canonical
          print(hashlib.sha256(raw).hexdigest())
          PY
          if [ "$CONFIRM_DELTA" = true ]; then
            [[ "$EXPECTED_BASELINE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test -f "$BASELINE_INVENTORY"
            test ! -L "$BASELINE_INVENTORY"
            test "$(sha256sum "$BASELINE_INVENTORY" | cut -d' ' -f1)" = \
              "$EXPECTED_BASELINE_INVENTORY_SHA256"
            baseline_commit=$(jq -r .source_commit "$BASELINE_INVENTORY")
            [[ "$baseline_commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$baseline_commit^{commit}"
            git merge-base --is-ancestor "$baseline_commit" "$EXPECTED_COMMIT"
            delta="$RUNNER_TEMP/historical-replay-inventory-delta.json"
            delta_recomputed="$RUNNER_TEMP/historical-replay-inventory-delta.recomputed.json"
            python scripts/reconcile_historical_replay_inventory_delta.py \
              --baseline "$BASELINE_INVENTORY" \
              --current "$artifact" \
              --inventory-schema "$INVENTORY_SCHEMA" \
              --results-root results \
              --results-commit "$EXPECTED_COMMIT" \
              --output "$delta"
            python scripts/reconcile_historical_replay_inventory_delta.py \
              --baseline "$BASELINE_INVENTORY" \
              --current "$artifact" \
              --inventory-schema "$INVENTORY_SCHEMA" \
              --results-root results \
              --results-commit "$EXPECTED_COMMIT" \
              --output "$delta_recomputed"
            cmp "$delta" "$delta_recomputed"
            DELTA="$delta" ARTIFACT="$artifact" python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          from jsonschema import Draft202012Validator, FormatChecker
          from referencing import Registry, Resource

          artifact_raw = pathlib.Path(os.environ["ARTIFACT"]).read_bytes()
          delta_path = pathlib.Path(os.environ["DELTA"])
          delta_raw = delta_path.read_bytes()
          assert 0 < len(delta_raw) <= int(os.environ["MAX_INVENTORY_BYTES"])
          delta = json.loads(delta_raw)
          inventory_schema = json.loads(
              pathlib.Path(os.environ["INVENTORY_SCHEMA"]).read_text(encoding="utf-8")
          )
          delta_schema = json.loads(
              pathlib.Path(os.environ["DELTA_SCHEMA"]).read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(delta_schema)
          registry = Registry().with_resource(
              inventory_schema["$id"], Resource.from_contents(inventory_schema)
          )
          validator = Draft202012Validator(
              delta_schema, registry=registry, format_checker=FormatChecker()
          )
          errors = sorted(validator.iter_errors(delta), key=lambda error: list(error.path))
          assert not errors, errors
          assert delta["baseline"]["inventory_sha256"] == os.environ[
              "EXPECTED_BASELINE_INVENTORY_SHA256"
          ]
          assert delta["current"]["source_commit"] == os.environ["EXPECTED_COMMIT"]
          assert delta["current"]["results_store_sha256"] == os.environ["EXPECTED_DIGEST"]
          assert delta["current"]["result_count"] == int(os.environ["EXPECTED_COUNT"])
          assert delta["current"]["inventory_sha256"] == hashlib.sha256(
              artifact_raw
          ).hexdigest()
          counts = delta["delta_counts"]
          assert counts["result_count"] == len(delta["entries"])
          assert counts["server_native_excluded"] == len(delta["server_exclusions"])
          assert counts["result_count"] + counts["server_native_excluded"] == (
              delta["current"]["result_count"] - delta["baseline"]["result_count"]
          )
          assert counts["result_count"] == (
              counts["public_source_probe_pending"]
              + counts["private_archive_migration_pending"]
          )
          identities = [entry["result_id"] for entry in delta["entries"]]
          assert identities == sorted(set(identities))
          excluded = [entry["result_id"] for entry in delta["server_exclusions"]]
          assert excluded == sorted(set(excluded))
          assert not set(identities) & set(excluded)
          canonical = (
              json.dumps(delta, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          assert delta_raw == canonical
          PY
            delta_sha256=$(sha256sum "$delta" | cut -d' ' -f1)
            echo "delta_sha256=$delta_sha256" >> "$GITHUB_OUTPUT"
            rm -f "$delta_recomputed"
          else
            test "$CONFIRM_DELTA" = false
          fi
          artifact_sha256=$(sha256sum "$artifact" | cut -d' ' -f1)
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          rm -f "$recomputed"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # actions/upload-artifact pinned to v7.0.1.
      - name: Upload only the source-free inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-replay-inventory-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/historical-replay-inventory.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload only the source-free append-only delta
        if: inputs.confirm_append_only_delta == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-replay-inventory-delta-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/historical-replay-inventory-delta.json
          if-no-files-found: error
          retention-days: 90

      - name: Record reviewed inventory identities
        env:
          ARTIFACT_SHA256: ${{ steps.inventory.outputs.artifact_sha256 }}
          BASELINE_INVENTORY_SHA256: ${{ inputs.expected_baseline_inventory_sha256 }}
          DELTA_SHA256: ${{ steps.inventory.outputs.delta_sha256 }}
          RESULT_COUNT: ${{ inputs.expected_result_count }}
          RESULTS_STORE_SHA256: ${{ inputs.expected_results_store_sha256 }}
          SOURCE_COMMIT: ${{ inputs.expected_commit }}
        run: |
          {
            echo '### Historical replay inventory'
            echo
            echo "- source commit: \`$SOURCE_COMMIT\`"
            echo "- canonical store digest: \`$RESULTS_STORE_SHA256\`"
            echo "- accepted result count: \`$RESULT_COUNT\`"
            echo "- artifact SHA-256: \`$ARTIFACT_SHA256\`"
            if [ -n "$DELTA_SHA256" ]; then
              echo "- append-only delta SHA-256: \`$DELTA_SHA256\`"
              echo "- baseline inventory SHA-256: \`$BASELINE_INVENTORY_SHA256\`"
            fi
            echo '- artifact contains no private source repository or commit locator'
            echo '- transient artifact is not durable qualification evidence until reviewed and committed'
          } >> "$GITHUB_STEP_SUMMARY"
