name: Independent-kernel shadow smoke

# Credential-free compatibility preflight for one reviewed public result and
# one exact Arena candidate. This workflow never changes acceptance, Results,
# State, releases, or the required checker set.
on:
  workflow_dispatch:

concurrency:
  group: kernel-shadow-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow:
    environment: replay-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FIXTURE: tests/fixtures/kernel-shadow-smoke-v1.json
      SOURCE_REPOSITORY: KitaKen1/lean-eval-two-plus-two
      SOURCE_COMMIT: a7cf16eead7f54a3eae4099c154eb80b0f520c92
      BENCHMARK_REPOSITORY: leanprover/lean-eval
      BENCHMARK_COMMIT: 21c6c02178e14cccc54b6e90e4836d1ca0e9c7e6
      EXPECTED_TOOLCHAIN: leanprover/lean4:v4.33.0
      MATHLIB_COMMIT: 6f1ef4e5dd604a435bddba4747b13970cd65d2a1
      EXPORTER_COMMIT: 15f6055e299ad5b89345e533cc2192f4cc00f659
      COMPARATOR_COMMIT: 19e111e2141cf333c7daff0f64c5f24acc91dd2e
      CANDIDATE_REPOSITORY: metalogiclabs/mathgraph-lean-kernel
      CANDIDATE_COMMIT: 3d7585c21242f29fdaa48ae9a16e16c6afe42238
      ARENA_COMMIT: 34f87c40f176904b4bca6be5469879e1083c2125
    steps:
      # Current repository supplies only the strict fixture, preparation code,
      # and source-free evidence validator.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval
          ref: 21c6c02178e14cccc54b6e90e4836d1ca0e9c7e6
          path: benchmark
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KitaKen1/lean-eval-two-plus-two
          ref: a7cf16eead7f54a3eae4099c154eb80b0f520c92
          path: source
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-kernel-arena
          ref: 34f87c40f176904b4bca6be5469879e1083c2125
          path: arena
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify immutable public inputs and Arena declaration
        run: |
          set -euo pipefail
          python scripts/kernel_shadow_smoke.py validate-fixture --fixture "$FIXTURE"
          test "$(git -C benchmark rev-parse HEAD)" = "$BENCHMARK_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C arena rev-parse HEAD)" = "$ARENA_COMMIT"
          test "$(cat benchmark/lean-toolchain)" = "$EXPECTED_TOOLCHAIN"
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['SOURCE_REPOSITORY']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              repository = json.load(response)
          if repository.get("full_name") != os.environ["SOURCE_REPOSITORY"]:
              raise SystemExit("GitHub returned the wrong source repository")
          if repository.get("private") is not False:
              raise SystemExit("source repository is not anonymously public")

          declaration = pathlib.Path("arena/checkers/mathgraph.yaml").read_text()
          required = {
              "url: https://github.com/metalogiclabs/mathgraph-lean-kernel",
              "ref: mathgraph",
              f"rev: {os.environ['CANDIDATE_COMMIT']}",
              '"use_stdin": true',
              '"nat_extension": true',
              '"string_extension": true',
          }
          missing = sorted(item for item in required if item not in declaration)
          if missing:
              raise SystemExit(f"Arena declaration drifted: missing {missing}")
          PY

      # A clean runner still needs room for Mathlib plus three source builds.
      # jlumbroso/free-disk-space pinned to 54081f13 (= refs/tags/v1.3.1).
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Install Elan only. The untrusted workspace does not exist yet, and we
      # must never let lean-action build it outside comparator's sandbox.
      # leanprover/lean-action pinned to 38fbc41a (= refs/tags/v1.5.0).
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: benchmark
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      # actions/setup-go pinned to b7ad1dad (= refs/tags/v7.0.0).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false

      - name: Pin Rust toolchain used to build the candidate
        run: |
          # The pinned candidate's Cargo.lock contains stumpalo 0.5.1, whose
          # declared MSRV is 1.95.0. An older compiler fails before the smoke.
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          test "$(rustc --version)" = "rustc 1.95.0 (59807616e 2026-04-14)"

      - name: Build exact sandbox, exporter, comparator, and candidate
        run: |
          set -euo pipefail
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          go_bin="$(go env GOPATH)/bin"

          git clone https://github.com/leanprover/lean4export.git .ci/lean4export
          git -C .ci/lean4export checkout "$EXPORTER_COMMIT"
          cp benchmark/lean-toolchain .ci/lean4export/lean-toolchain
          (cd .ci/lean4export && lake build lean4export)

          git clone https://github.com/leanprover/comparator.git .ci/comparator
          git -C .ci/comparator checkout "$COMPARATOR_COMMIT"
          (cd .ci/comparator && lake build comparator)

          git clone "https://github.com/${CANDIDATE_REPOSITORY}.git" .ci/mathgraph
          git -C .ci/mathgraph checkout "$CANDIDATE_COMMIT"
          cargo build --locked --release --manifest-path .ci/mathgraph/Cargo.toml

          {
            echo "$go_bin"
            echo "$GITHUB_WORKSPACE/.ci/comparator/.lake/build/bin"
          } >> "$GITHUB_PATH"
          {
            echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/.ci/lean4export/.lake/build/bin/lean4export"
            echo "COMPARATOR_LANDRUN=$go_bin/landrun"
            echo "CANDIDATE_BINARY=$GITHUB_WORKSPACE/.ci/mathgraph/target/release/sokonanoda"
          } >> "$GITHUB_ENV"

      - name: Remove checkout credentials and nondependency Git metadata
        run: |
          set -euo pipefail
          find . -type d -name .git -prune -exec rm -rf '{}' +
          if find . \
              -type d -name .git -print -quit | grep -q .; then
            echo "checkout or component Git metadata survived stripping" >&2
            exit 1
          fi

      - name: Prove the untrusted sandbox and environment boundary
        run: |
          python benchmark/scripts/sandbox_engaged_probe.py --require-tools
          python benchmark/scripts/security_probes/env_dump_probe.py --require-tools

      - name: Prepare reviewed public submission without elaborating it
        run: |
          set -euo pipefail
          python scripts/kernel_shadow_smoke.py prepare-workspace \
            --fixture "$FIXTURE" \
            --source-root source \
            --generated-root benchmark/generated \
            --output /tmp/kernel-shadow-workspace \
            --candidate-binary "$CANDIDATE_BINARY"
          (cd /tmp/kernel-shadow-workspace && lake update && lake exe cache get)
          test "$(git -C /tmp/kernel-shadow-workspace/.lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_COMMIT"
          python scripts/public_replay_smoke.py validate-public-dependency-git \
            --root /tmp/kernel-shadow-workspace/.lake/packages

      - name: Run candidate in non-authoritative shadow mode
        id: shadow
        continue-on-error: true
        run: |
          set +e
          start_ns=$(date +%s%N)
          (cd /tmp/kernel-shadow-workspace && \
            lake env "$GITHUB_WORKSPACE/.ci/comparator/.lake/build/bin/comparator" config.json)
          status=$?
          end_ns=$(date +%s%N)
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "wall_time_ms=$(((end_ns - start_ns) / 1000000))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build and validate source-free shadow evidence
        if: always()
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          PIPELINE_EXIT_CODE: ${{ steps.shadow.outputs.exit_code }}
          PIPELINE_WALL_TIME_MS: ${{ steps.shadow.outputs.wall_time_ms }}
        run: |
          set -euo pipefail
          test -n "$PIPELINE_EXIT_CODE"
          test -n "$PIPELINE_WALL_TIME_MS"
          python scripts/kernel_shadow_smoke.py evidence \
            --fixture "$FIXTURE" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --pipeline-exit-code "$PIPELINE_EXIT_CODE" \
            --pipeline-wall-time-ms "$PIPELINE_WALL_TIME_MS" \
            --output /tmp/kernel-shadow-evidence.json
          python scripts/kernel_shadow_smoke.py validate-evidence \
            --evidence /tmp/kernel-shadow-evidence.json

      # Only strict source-free evidence crosses the job boundary.
      # actions/upload-artifact pinned to 043fb46d (= refs/tags/v7.0.1).
      - name: Upload source-free evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-shadow-smoke-evidence
          path: /tmp/kernel-shadow-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Require the compatibility smoke to accept
        if: always()
        env:
          PIPELINE_EXIT_CODE: ${{ steps.shadow.outputs.exit_code }}
        run: test "$PIPELINE_EXIT_CODE" = 0
