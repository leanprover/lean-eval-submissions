name: Verify historical private replay resources are absent

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_inventory:
        description: Verify no task-scoped private replay executor remains
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: lean-eval-historical-private-replay-resource-audit
  cancel-in-progress: false

jobs:
  inventory:
    if: inputs.confirm_read_only_inventory == true
    permissions:
      contents: read
    environment: replay-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require disabled controller and protected main
        env:
          CONTROLLER_ENABLED: ${{ vars.HISTORICAL_PRIVATE_REPLAY_CONTROLLER_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = leanprover/lean-eval-submissions
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$CONTROLLER_ENABLED" = false
          branch=$(gh api repos/leanprover/lean-eval-submissions/branches/main \
            --jq '[.commit.sha, .protected] | @tsv')
          test "$branch" = "$GITHUB_SHA"$'\ttrue'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install the pinned Cloudflare client
        run: npm ci --prefix server

      - name: Prove the task-scoped Worker and container inventories are empty
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = a46b90978a1c29cc4795f30677e7e4b8
          services="$RUNNER_TEMP/worker-services.json"
          applications="$RUNNER_TEMP/container-applications.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services?per_page=100" \
            --output "$services"
          jq -e '
            .success == true and .errors == [] and
            (.result | type == "array") and
            (.result_info.total_pages == 1) and
            ([.result[] | .name // .id | select(startswith("hpr-"))] | length) == 0
          ' "$services" >/dev/null
          npx --prefix server wrangler containers list --json > "$applications"
          jq -e '
            type == "array" and
            ([.[] | .name | select(startswith("le-hpr-"))] | length) == 0
          ' "$applications" >/dev/null
          echo 'No historical private replay Worker or container application remains.' \
            >> "$GITHUB_STEP_SUMMARY"
