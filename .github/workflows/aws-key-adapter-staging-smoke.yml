name: AWS key-adapter staging smoke

# Synthetic, staging-only KMS wrap/one-use unwrap round trip. The artifact is
# ciphertext plus a provider-neutral envelope and marker digest; no source,
# age identity, AWS credential, State event, result, or release is uploaded.
on:
  workflow_dispatch:

concurrency:
  group: aws-key-adapter-staging-smoke
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require an immutable protected dispatch tag
        env:
          EXACT_REF: refs/tags/lean-eval-dispatch/${{ github.sha }}
        run: test "$GITHUB_REF" = "$EXACT_REF"

  wrap:
    needs: gate
    environment: archive-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          python-version: '3.11.10'

      - name: Install hash-locked AWS adapter dependencies
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python -m pip install --disable-pip-version-check --require-hashes \
            -r infrastructure/aws-key-adapter/requirements-workflow.txt

      - name: Install checksum-pinned age 1.3.1
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output /tmp/age-v1.3.1.tar.gz
          echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age-v1.3.1.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/age-v1.3.1.tar.gz --directory /tmp
          test "$(/tmp/age/age --version)" = "v1.3.1"
          echo /tmp/age >> "$GITHUB_PATH"

      - name: Prepare a synthetic source before assuming AWS authority
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python scripts/aws_key_adapter_live_smoke.py prepare-source \
            --output /tmp/aws-smoke-source.tar.gz \
            --expectation-output /tmp/aws-smoke-artifact/expectation.json

      # aws-actions/configure-aws-credentials pinned to v6.2.3.
      - name: Assume the staging Encrypt-only role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_WRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: lean-eval-archive-staging-smoke
          mask-aws-account-id: true

      - name: Wrap one fresh identity and drop AWS authority
        id: wrap
        env:
          LEAN_EVAL_KMS_KEY_ID: alias/lean-eval-archive-identities-staging
          LEAN_EVAL_ADAPTER_NAME: aws-kms-v1
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          clear_aws() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            {
              echo 'AWS_ACCESS_KEY_ID='
              echo 'AWS_SECRET_ACCESS_KEY='
              echo 'AWS_SESSION_TOKEN='
            } >> "$GITHUB_ENV"
          }
          trap clear_aws EXIT
          python scripts/archive_envelope.py \
            --source-tar /tmp/aws-smoke-source.tar.gz \
            --submission-id 0198c4ee-7d2d-7b35-8d20-cd5db8aa9a6f \
            --output-dir /tmp/aws-smoke-artifact/archive \
            --adapter-executable scripts/aws_key_adapter.py \
            --adapter-name aws-kms-v1
          clear_aws
          rm /tmp/aws-smoke-source.tar.gz
          python scripts/aws_key_adapter_live_smoke.py validate-artifact \
            --root /tmp/aws-smoke-artifact

      # actions/upload-artifact pinned to 043fb46d (= refs/tags/v7.0.1).
      - name: Upload only ciphertext, envelope, and marker digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          name: aws-key-adapter-staging-smoke
          path: /tmp/aws-smoke-artifact
          if-no-files-found: error
          retention-days: 1

  unwrap:
    needs: wrap
    environment: replay-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          python-version: '3.11.10'

      # actions/download-artifact pinned to 3e5e8f8e (= refs/tags/v8.0.1).
      - uses: actions/download-artifact@3e5e8f8ef8d0498d751e7c09d3fb929b1f3dcff5
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          name: aws-key-adapter-staging-smoke
          path: /tmp/aws-smoke-artifact

      - name: Validate source-free artifact and build a five-minute capability
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          python scripts/aws_key_adapter_live_smoke.py validate-artifact \
            --root /tmp/aws-smoke-artifact
          python scripts/aws_key_adapter_live_smoke.py build-unwrap-request \
            --artifact-root /tmp/aws-smoke-artifact \
            --workflow-commit "$GITHUB_SHA" \
            --output /tmp/unwrap-request.json

      - name: Install checksum-pinned age 1.3.1
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output /tmp/age-v1.3.1.tar.gz
          echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  /tmp/age-v1.3.1.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/age-v1.3.1.tar.gz --directory /tmp
          test "$(/tmp/age/age --version)" = "v1.3.1"
          echo /tmp/age >> "$GITHUB_PATH"

      - name: Require the preinstalled AWS CLI v2
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          aws --version 2>&1 | grep -E '^aws-cli/2\.'

      - name: Assume the staging Invoke-only replay role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_REPLAY_UNWRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: lean-eval-replay-staging-smoke
          mask-aws-account-id: true

      - name: Consume once, reject reuse, then decrypt without AWS authority
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          clear_aws() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            {
              echo 'AWS_ACCESS_KEY_ID='
              echo 'AWS_SECRET_ACCESS_KEY='
              echo 'AWS_SESSION_TOKEN='
            } >> "$GITHUB_ENV"
          }
          cleanup() {
            clear_aws
            rm -f \
              /tmp/identity.age \
              /tmp/decrypted-source.tar.gz \
              /tmp/unwrap-request.json \
              /tmp/unwrap-response.json \
              /tmp/reuse-response.json
          }
          trap cleanup EXIT

          aws lambda invoke \
            --function-name lean-eval-archive-unwrap-staging \
            --qualifier live \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/unwrap-request.json \
            /tmp/unwrap-response.json > /tmp/unwrap-metadata.json
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            python scripts/aws_key_adapter_live_smoke.py validate-unwrap-response \
              --request /tmp/unwrap-request.json \
              --metadata /tmp/unwrap-metadata.json \
              --response /tmp/unwrap-response.json \
              --identity-output /tmp/identity.age

          aws lambda invoke \
            --function-name lean-eval-archive-unwrap-staging \
            --qualifier live \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/unwrap-request.json \
            /tmp/reuse-response.json > /tmp/reuse-metadata.json
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            python scripts/aws_key_adapter_live_smoke.py validate-reuse-failure \
              --metadata /tmp/reuse-metadata.json \
              --response /tmp/reuse-response.json

          clear_aws
          age --decrypt --identity /tmp/identity.age \
            --output /tmp/decrypted-source.tar.gz \
            /tmp/aws-smoke-artifact/archive/source.tar.gz.age
          python scripts/aws_key_adapter_live_smoke.py verify-decrypted \
            --decrypted-tar /tmp/decrypted-source.tar.gz \
            --expectation /tmp/aws-smoke-artifact/expectation.json
          cleanup
          trap - EXIT
