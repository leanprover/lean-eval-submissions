name: Promote workflow-only immutable dispatch ref

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-workflow-dispatch-ref.yml'
      - '.github/workflows/accepted-archive-replay-staging.yml'
      - '.github/workflows/authoritative-replay-staging.yml'
      - '.github/workflows/aws-key-adapter-staging-smoke.yml'
      - '.github/workflows/historical-public-authority-preparation.yml'
      - '.github/workflows/historical-public-image-qualification.yml'
      - '.github/workflows/historical-public-replay-plan.yml'
      - '.github/workflows/historical-public-runner-contract.yml'
      - '.github/workflows/historical-replay-inventory.yml'
      - '.github/workflows/public-replay-github-evidence.yml'
      - '.github/workflows/set-staging-intake.yml'

permissions:
  contents: read

concurrency:
  group: workflow-dispatch-ref-promotion
  cancel-in-progress: false

jobs:
  promote-dispatch-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: submission-dispatch-promotion
    permissions:
      contents: write
    steps:
      - name: Create or verify immutable workflow-dispatch tag
        env:
          APPROVAL_GUARD: ${{ secrets.DISPATCH_PROMOTION_APPROVAL_GUARD }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVAL_GUARD" =~ ^[0-9a-f]{64}$ ]]; then
            echo "reviewed dispatch-promotion environment is not configured" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow commit is not a full lowercase SHA" >&2
            exit 1
          fi
          status=$(timeout 20s gh api "repos/$REPOSITORY/compare/$WORKFLOW_COMMIT...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "workflow commit is not reachable from protected main" >&2
            exit 1
          fi
          timeout 20s gh api "repos/$REPOSITORY/contents/.github/workflows/submission.yml?ref=$WORKFLOW_COMMIT" \
            --jq .sha >/dev/null
          timeout 20s gh api "repos/$REPOSITORY/contents/.github/workflows/promotion-canary.yml?ref=$WORKFLOW_COMMIT" \
            --jq .sha >/dev/null

          tag="lean-eval-dispatch/$WORKFLOW_COMMIT"
          if existing=$(timeout 20s gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$WORKFLOW_COMMIT" ]; then
              echo "dispatch tag collision: $tag resolves to $existing" >&2
              exit 1
            fi
          else
            # Another protected minter may win this exact-tag race. The strict
            # read-back below distinguishes that success from every other error.
            timeout 20s gh api "repos/$REPOSITORY/git/refs" \
              -X POST \
              -f "ref=refs/tags/$tag" \
              -f "sha=$WORKFLOW_COMMIT" >/dev/null || true
          fi
          resolved=$(timeout 20s gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          if [ "$resolved" != "$WORKFLOW_COMMIT" ]; then
            echo "dispatch tag read-back did not resolve to the reviewed commit" >&2
            exit 1
          fi
