name: Roll back submission Worker

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      expected_commit:
        description: Full Git commit recorded by that Worker version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: submission-worker-main
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node pinned to v6.5.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - name: Validate rollback inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.version_id }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$TARGET_VERSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "version_id must be a canonical lowercase UUID" >&2
            exit 1
          fi
          dispatch_ref="lean-eval-dispatch/$EXPECTED_COMMIT"
          resolved=$(gh api "repos/$REPOSITORY/git/ref/tags/$dispatch_ref" --jq .object.sha)
          if [ "$resolved" != "$EXPECTED_COMMIT" ]; then
            echo "rollback dispatch tag does not resolve to expected_commit" >&2
            exit 1
          fi

          version_json=$(mktemp)
          trap 'rm -f "$version_json"' EXIT
          npx wrangler versions view "$TARGET_VERSION" --env production --json \
            > "$version_json"
          python - "$version_json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              version = json.load(source)
          bindings = version.get("resources", {}).get("bindings", [])
          expected = {
              "DEPLOYED_COMMIT": os.environ["EXPECTED_COMMIT"],
              "DEPLOYMENT_ENVIRONMENT": "production",
              "DISPATCH_WORKFLOW_REF": "lean-eval-dispatch/" + os.environ["EXPECTED_COMMIT"],
          }
          for name, wanted in expected.items():
              matches = [binding for binding in bindings if binding.get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(f"target version has no unique {name} binding")
              actual = matches[0].get("text", matches[0].get("value"))
              if actual != wanted:
                  raise SystemExit(
                      f"target version records {name}={actual!r}, not {wanted!r}"
                  )
          PY

      - name: Roll back production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_VERSION: ${{ inputs.version_id }}
        run: >-
          npx wrangler rollback "$TARGET_VERSION" --env production
          --yes
          --message "Manual rollback by $GITHUB_ACTOR from $GITHUB_SHA"

      - name: Verify restored production version
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          body=$(curl --fail --retry 6 --retry-all-errors --retry-delay 5 \
            https://lean-eval-submission-server.lean-eval.workers.dev/healthz)
          HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == "production"
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_enabled"] is False
          PY
