# CI for the submission pipeline. There is no Lean build here. The benchmark
# and comparator/sandbox integration live in leanprover/lean-eval and are
# exercised by that repo's CI. See SECURITY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Committed historical evidence tests reconstruct the exact Results
          # tree at their bound source commit, not the growing live tree.
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # actions/setup-go pinned to b7ad1dad (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so this exact version is
          # the compiler used for the pinned Go tools and helper below.
          go-version: '1.25.12'
          cache-dependency-path: server/age-file-key/go.sum

      - name: Install actionlint
        run: |
          # actionlint pinned to 914e7df2 (= refs/tags/v1.7.12 as of 2026-05-19).
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Python syntax checks
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Test age file-key helper
        working-directory: server/age-file-key
        run: CGO_ENABLED=0 go test -mod=readonly ./...

      - name: Install pinned Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-jsonschema-workflow.txt
          -r requirements-replay-token-transfer.txt

      - name: Audit workflow action pins
        run: python scripts/action_pin_audit.py

      - name: Lint workflows
        run: actionlint

      - name: Offline test suite
        # Discovery keeps every ordinary tests/test_*.py module in CI without
        # a second hand-maintained inventory that can silently become stale.
        run: python -m unittest discover -v -s tests -p 'test_*.py'

  artifact-upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create round-trip fixture
        run: |
          mkdir -p artifact-roundtrip
          printf '%s\n' 'node24-artifact-roundtrip' > artifact-roundtrip/fixture.txt

      # actions/upload-artifact pinned to 043fb46d (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-artifact-roundtrip
          path: artifact-roundtrip/fixture.txt

  artifact-download:
    needs: artifact-upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/download-artifact pinned to 3e5f45b2 (= refs/tags/v8.0.1 as of 2026-07-30).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-artifact-roundtrip
          path: artifact-roundtrip

      - name: Verify flat artifact extraction
        run: |
          expected='node24-artifact-roundtrip'
          actual=$(<artifact-roundtrip/fixture.txt)
          if [ "$actual" != "$expected" ]; then
            echo "artifact round-trip mismatch"
            exit 1
          fi
