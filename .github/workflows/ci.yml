# CI for the submission pipeline. This repo is pure Python + workflows;
# there is no Lean build here. The benchmark and the comparator/sandbox
# integration live in leanprover/lean-eval and are exercised by that
# repo's CI. See SECURITY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # actions/setup-go pinned to b7ad1dad (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so this exact version is
          # the compiler used for the pinned Go tools below.
          go-version: '1.25.12'
          # This repository has no Go module dependency file for setup-go to
          # hash; Go tools are installed at immutable revisions below.
          cache: false

      - name: Install actionlint
        run: |
          # actionlint pinned to 914e7df2 (= refs/tags/v1.7.12 as of 2026-05-19).
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Python syntax checks
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Install pinned JSON Schema validator
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-jsonschema-workflow.txt

      - name: Audit workflow action pins
        run: python scripts/action_pin_audit.py

      - name: Lint workflows
        run: actionlint

      - name: Workflow-structure test
        # Asserts the submission.yml invariants the cross-repo rewrite is
        # most likely to break (two checkouts, persist-credentials, the
        # benchmark-commit source, probe paths, the separate results-store
        # checkout). See tests/test_submission_workflow.py.
        run: >-
          python -m unittest
          tests.test_submission_workflow
          tests.test_server_archive_workflow
          tests.test_staging_promotion_canary
          tests.test_staging_intake_workflow
          tests.test_worker_deployment_workflow
          tests.test_prepare_intake_enablement_lease
          tests.test_validate_cloudflare_rollback
          tests.test_monitor_cloudflare_health
          tests.test_historical_replay_inventory
          tests.test_historical_replay_inventory_workflow
          tests.test_prepare_public_replay_resolution
          tests.test_resolve_public_replay_github_evidence
          tests.test_public_replay_github_evidence_workflow
          tests.test_aggregate_public_replay_github_evidence
          tests.test_prepare_public_replay_plan
          tests.test_historical_public_replay_plan_workflow
          tests.test_worker_intake_configuration

      - name: Submission intake tests
        run: python -m unittest tests.test_validate_submission_intake

      - name: Leaderboard update tests
        run: >-
          python -m unittest
          tests.test_results_schema
          tests.test_build_result_receipt
          tests.test_migrate_results_v2
          tests.test_update_leaderboard
          tests.test_migration_workflow

      - name: Fetch submission tests
        run: python -m unittest tests.test_fetch_submission

      - name: Evaluate submission tests
        run: python -m unittest tests.test_evaluate_submission

      - name: Archive key adapter tests
        run: >-
          python -m unittest
          tests.test_archive_submission
          tests.test_archive_envelope
          tests.test_migrate_archive_envelopes
          tests.test_key_capability_contract
          tests.test_aws_key_adapter
          tests.test_aws_key_infrastructure
          tests.test_aws_key_adapter_staging_workflow

      - name: Replay, public smoke, and kernel corpus contract tests
        run: >-
          python -m unittest
          tests.test_replay_orchestrator
          tests.test_authoritative_replay_image
          tests.test_public_replay_smoke
          tests.test_public_replay_workflow
          tests.test_public_replay_json_schemas
          tests.test_committed_public_replay_evidence
          tests.test_historical_replay_profile_matrix
          tests.test_historical_public_runner
          tests.test_historical_public_image_qualification
          tests.test_prepare_historical_public_authority
          tests.test_kernel_corpus_report
          tests.test_kernel_corpus_runner_adapter
          tests.test_kernel_runner_wire_contract
          tests.test_kernel_corpus_json_schemas

  artifact-upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create round-trip fixture
        run: |
          mkdir -p artifact-roundtrip
          printf '%s\n' 'node24-artifact-roundtrip' > artifact-roundtrip/fixture.txt

      # actions/upload-artifact pinned to 043fb46d (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-artifact-roundtrip
          path: artifact-roundtrip/fixture.txt

  artifact-download:
    needs: artifact-upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/download-artifact pinned to 3e5f45b2 (= refs/tags/v8.0.1 as of 2026-07-30).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-artifact-roundtrip
          path: artifact-roundtrip

      - name: Verify flat artifact extraction
        run: |
          expected='node24-artifact-roundtrip'
          actual=$(<artifact-roundtrip/fixture.txt)
          if [ "$actual" != "$expected" ]; then
            echo "artifact round-trip mismatch"
            exit 1
          fi
