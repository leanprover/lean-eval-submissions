# Auth (lean-eval-bot GitHub App, lean-eval-recorder GitHub App, and
# LEADERBOARD_WRITE_TOKEN PAT) is documented in docs/ci-secrets.md.
#
# Security model: untrusted submitter Lean code is ONLY ever elaborated
# inside comparator's landrun sandbox (invoked from `lake test` via
# WorkspaceTest.lean). The non-negotiable invariants of this workflow
# (`APP_INSTALLATION_TOKEN` scoped to each job's single source-fetch
# step, .git stripped from BOTH evaluation checkouts before lake runs,
# `_prime_workspace` not pre-building any user-controlled targets, etc.)
# are documented in SECURITY.md. Read that section before editing this
# file or `scripts/evaluate_submission.py`.
#
# The trusted `archive` job independently fetches, encrypts, and durably
# persists the exact source before evaluation starts. The `evaluate` job
# then independently fetches that frozen commit and evaluates it on the
# same runner. A previous version uploaded cloned source as a workflow
# artifact, but artifacts from this public repository can expose private
# submissions. No plaintext source crosses jobs; do not replace either
# exact fetch with a source artifact.
#
# Two checkouts: this repo (lean-eval-submissions) supplies the
# pipeline scripts; `leanprover/lean-eval` supplies the benchmark
# (generated/ workspaces, manifests/, the `lean-eval` Lean CLI). The
# submission is scored against `leanprover/lean-eval@main` HEAD and the
# resolved SHA is recorded as `benchmark_commit`.
name: Submission

on:
  workflow_dispatch:
    inputs:
      workflow_commit: {description: 'Commit encoded in the immutable dispatch tag', required: true, type: string}
      submission_id: {description: 'Canonical UUIDv7 allocated by the Worker', required: true, type: string}
      submitted_by: {description: 'Verified lowercase GitHub login', required: true, type: string}
      source_repository: {description: 'Canonical owner/repository', required: true, type: string}
      source_commit: {description: 'Exact lowercase 40-character commit', required: true, type: string}
      source_visibility: {description: 'Worker-verified public or private', required: true, type: string}
      problem_id: {description: 'Canonical problem identifier', required: true, type: string}
      problem_group: {description: 'Catalog policy group', required: true, type: string}
      statement_revision: {description: 'Positive catalog statement revision', required: true, type: string}
      declared_model: {description: 'Verbatim declared model', required: true, type: string}
      publication_choice: {description: 'scheduled or withheld', required: true, type: string}
      production_metadata_json: {description: 'Strict bounded production metadata object', required: true, type: string}
      archive_locator_required: {description: 'Must be literal true', required: true, type: string}
      archive_sidecar_schema: {description: 'Must be literal 3', required: true, type: string}
      archive_state_callback_required: {description: 'Must be literal true', required: true, type: string}
      callback_environment:
        description: 'Worker environment receiving trusted lifecycle callbacks'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  # Per-submission concurrency: each canonical server submission gets its own
  # group so parallel submissions from the same user do not cancel each other.
  # GitHub keeps at most 1 running + 1 pending per group, and any newer
  # pending run cancels the previously-pending one — which manifested as
  # silent dropouts when several submissions were dispatched in quick succession.
  # Concurrent leaderboard pushes from sibling runs are already handled
  # by the `record` job's push-retry loop below.
  group: submission-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    needs: [archive, archive_state]
    if: >-
      always() &&
      needs.archive.result == 'success' &&
      needs.archive_state.result == 'success'
    # 16 GB of RAM is the ceiling a submission has to fit under. A build
    # that exceeds it is SIGTERM-killed mid-elaboration with exit 143 and
    # no Lean error, which reads as a compile failure but is not one.
    # `ubuntu-latest-large` is not an escape hatch: measured on this org's
    # pool (2026-08-19, issue #1078) it reports the same 4 cores / 15 GiB
    # / 3 GiB swap as `ubuntu-latest`.
    runs-on: ubuntu-latest
    # 360 minutes is GitHub's per-job ceiling for hosted runners; set it
    # explicitly so genuinely long proofs run to the platform limit rather
    # than being cut off, and so the intended cap stays visible here.
    timeout-minutes: 360
    # The default `GITHUB_TOKEN` is not placed into the environment of any
    # step that runs untrusted Lean. The `lean-eval-bot` installation token
    # (which can read private
    # submission repos) is similarly scoped to the single `Fetch
    # submission` step's env. persist-credentials:false on BOTH checkouts
    # + `rm -rf .git` on BOTH before lake runs ensures no checkout token
    # persists into the lake runtime either.
    permissions:
      contents: read
    # The archive job freezes the benchmark and source identities before this
    # job starts. This job refetches both and fails closed on any mismatch.
    outputs:
      benchmark_commit: ${{ steps.benchmark.outputs.sha }}
      toolchain: ${{ steps.benchmark.outputs.toolchain }}
    steps:
      - name: Assert immutable server workflow ref
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          CALLBACK_REQUIRED: ${{ inputs.archive_state_callback_required }}
        run: |
          if [[ ! "$EXPECTED_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid expected workflow commit" >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_WORKFLOW_COMMIT" ]; then
            echo "dispatch tag no longer resolves to the expected workflow commit" >&2
            exit 1
          fi
          if [ "$CALLBACK_REQUIRED" != "true" ]; then
            echo "server dispatch did not require the State lifecycle callback" >&2
            exit 1
          fi
          if [ "$CALLBACK_ENVIRONMENT" != "staging" ] && [ "$CALLBACK_ENVIRONMENT" != "production" ]; then
            echo "server dispatch selected an invalid callback environment" >&2
            exit 1
          fi

      # This repo (lean-eval-submissions): supplies the pipeline scripts.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # The benchmark repo: supplies generated/, manifests/, the Lean CLI.
      # Scored against main HEAD; persist-credentials:false because this
      # tree shares the runner with the untrusted build.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval
          ref: ${{ needs.archive.outputs.benchmark_commit }}
          path: lean-eval
          persist-credentials: false

      - name: Resolve benchmark commit
        id: benchmark
        env:
          EXPECTED_BENCHMARK_COMMIT: ${{ needs.archive.outputs.benchmark_commit }}
          EXPECTED_TOOLCHAIN: ${{ needs.archive.outputs.toolchain }}
        run: |
          actual_commit=$(git -C lean-eval rev-parse HEAD)
          actual_toolchain=$(cat lean-eval/lean-toolchain)
          if [ "$actual_commit" != "$EXPECTED_BENCHMARK_COMMIT" ]; then
            echo "benchmark checkout does not match the archived commit" >&2
            exit 1
          fi
          if [ "$actual_toolchain" != "$EXPECTED_TOOLCHAIN" ]; then
            echo "benchmark toolchain does not match the archived toolchain" >&2
            exit 1
          fi
          echo "sha=$actual_commit" >> "$GITHUB_OUTPUT"
          echo "toolchain=$actual_toolchain" >> "$GITHUB_OUTPUT"

      - name: Extract source owner
        id: owner
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          python - <<'PY'
          import os, re, sys
          repository = os.environ.get("SOURCE_REPOSITORY", "")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              sys.exit("invalid server source repository")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("kind=github_repo\n")
              fh.write(f"owner={repository.split('/', 1)[0]}\n")
          PY

      - name: Mint lean-eval-bot installation token
        id: app_token
        if: steps.owner.outputs.kind == 'github_repo'
        # actions/create-github-app-token pinned to bcd2ba49 (= refs/tags/v3.2.0 as of 2026-07-30).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        continue-on-error: true
        with:
          client-id: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}
          owner: ${{ steps.owner.outputs.owner }}

      - name: Clean evaluation scratch dirs
        # A no-op on the ephemeral hosted runners this workflow targets,
        # where /tmp starts empty. Kept as defence in depth: on any runner
        # that persisted /tmp across jobs, stale scratch state would break
        # fetch's checkout ("untracked working tree files would be
        # overwritten ... Aborting") and could leak one submission's source
        # into the next job's build.
        run: rm -rf /tmp/fetch-out /tmp/submission-src /tmp/evaluate-out

      - name: Fetch submission
        id: fetch
        env:
          # Step-scoped: the app token is NOT present in the env of any
          # later step in this job. This is the load-bearing assumption
          # that lets fetch + evaluate share a job without leaking
          # access to private submission repos into the landrun-sandboxed
          # evaluation. Do not promote this to a job-level env or
          # secrets block.
          APP_INSTALLATION_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          python scripts/fetch_submission.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --server-dispatch \
            --output-dir /tmp/fetch-out

      - name: Verify frozen source identity
        if: steps.fetch.outcome == 'success'
        env:
          EXPECTED_METADATA_SHA256: ${{ needs.archive.outputs.source_metadata_sha256 }}
        run: |
          actual=$(sha256sum /tmp/fetch-out/metadata.json | cut -d' ' -f1)
          if [[ ! "$EXPECTED_METADATA_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "archive did not provide a valid frozen metadata digest" >&2
            exit 1
          fi
          if [ "$actual" != "$EXPECTED_METADATA_SHA256" ]; then
            echo "evaluation refetch does not match the source archived before evaluation" >&2
            exit 1
          fi

      - name: Free disk space for Mathlib cache
        # Standard runners ship with ~14GB free; Mathlib unpacked is
        # several GB and we hold it twice (repo root + per-workspace).
        # Strip Android, .NET, Haskell, and other preinstalled caches we
        # do not need. Frees ~30GB.
        # jlumbroso/free-disk-space pinned to 54081f13 (= refs/tags/v1.3.1, also main HEAD as of 2026-05-04).
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Strip git state before running untrusted Lean
        # Both checkouts: comparator's landrun policy is `--ro /`, so any
        # authenticated remote left in a `.git/config` anywhere the
        # sandbox can stat it is readable by the untrusted Lean elaborator.
        run: rm -rf .git lean-eval/.git

      # leanprover/lean-action pinned to 38fbc41a (= refs/tags/v1.5.0, also v1 HEAD as of 2026-05-04).
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: lean-eval
          use-mathlib-cache: true
          # The evaluate job deliberately omits actions:write. Disable the
          # futile GitHub cache save (and its warning) instead of broadening
          # the token available to the job that runs untrusted Lean.
          # Mathlib's independent `lake exe cache get` remains enabled above.
          use-github-cache: false

      # actions/setup-go pinned to b7ad1dad (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # Concrete Go version, not `stable`, so a runner-image bump cannot
          # silently change the toolchain we install landrun with.
          go-version: '1.25.12'
          # This repository has no Go module dependency file for setup-go to
          # hash; the only Go dependency is pinned directly in `go install`.
          cache: false

      - name: Install landrun
        run: |
          # landrun pinned to 5ed4a3db (zouuup/landrun main HEAD as of 2026-05-04).
          # Bump procedure: leanprover/lean-eval SECURITY.md > "Bumping pinned dependencies".
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build lean4export
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean4export.git .ci/lean4export
          cd .ci/lean4export
          # lean4export pinned to 4e791520 (= refs/tags/v4.32.0 as of 2026-07-29).
          # Bump procedure: leanprover/lean-eval SECURITY.md > "Bumping pinned dependencies".
          git checkout 4e7915201d3f9f04470d9eae002fa695f7cdc589  # pin-audit: exempt -- SHA, see comment
          cp "$GITHUB_WORKSPACE/lean-eval/lean-toolchain" lean-toolchain
          lake build lean4export
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build comparator
        run: |
          git clone https://github.com/leanprover/comparator.git .ci/comparator
          cd .ci/comparator
          # comparator pinned to 71b52ec2 (leanprover/comparator, originally adopted before 2026-05-04).
          # Bump procedure: leanprover/lean-eval SECURITY.md > "Bumping pinned dependencies".
          git checkout 71b52ec29e06d4b7d882726553b1ceb99a2499e0  # pin-audit: exempt -- SHA, see comment
          lake build comparator
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build nanoda
        run: |
          set -euo pipefail
          # The external checker. WorkspaceTest forces `enable_nanoda: true`
          # when it invokes comparator, so every scored Solution is replayed
          # through nanoda's independent kernel and rejected unless `nanoda_bin`
          # is on PATH. cargo is preinstalled on the runner image. The trust
          # boundary is the pinned source commit, not the Rust compiler version.
          git clone https://github.com/robsimmons/nanoda_lib.git .ci/nanoda
          cd .ci/nanoda
          # nanoda pinned to 68d5ca9 (robsimmons/nanoda_lib HEAD as of 2026-07-29,
          # the fork comparator-live deploys). Bump procedure: leanprover/lean-eval
          # SECURITY.md > "Bumping pinned dependencies".
          git checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840  # pin-audit: exempt -- SHA, see comment
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # SECURITY: probes that gate every submission. A regression here
      # (sandbox not engaged, or env-var leak) means we cannot trust any
      # downstream comparator verdict — abort before touching the
      # submission. The probe scripts live in leanprover/lean-eval (which
      # owns the comparator/sandbox integration); they are run here from
      # the lean-eval checkout. See leanprover/lean-eval SECURITY.md >
      # "Validations done at submission time".
      - name: Probe sandbox is engaged
        run: python lean-eval/scripts/sandbox_engaged_probe.py --require-tools

      - name: Probe env-var allowlist
        run: python lean-eval/scripts/security_probes/env_dump_probe.py --require-tools

      - name: Extract submission source
        run: |
          mkdir -p /tmp/submission-src
          tar -xzf /tmp/fetch-out/source.tar.gz -C /tmp/submission-src --strip-components=1

      - name: Run evaluate_submission.py
        # Sharing the benchmark repo's .lake/packages tree across every
        # per-submission workspace lets each `lake update` reuse Mathlib
        # (~3GB unpacked) instead of cloning + decompressing it per
        # workspace. Required to handle submissions that overlay several
        # generated workspaces on a single runner without "no space left
        # on device". Assumes generated workspaces stay in lock-step with
        # the benchmark repo on dependency revs (they do, by construction).
        run: |
          python scripts/evaluate_submission.py \
            --source-dir /tmp/submission-src \
            --generated-root lean-eval/generated \
            --manifest-dir lean-eval/manifests/problems \
            --output-dir /tmp/evaluate-out \
            --repo-root lean-eval \
            --shared-packages lean-eval/.lake/packages

      - name: Copy frozen metadata through to record
        if: always()
        run: cp /tmp/fetch-out/metadata.json /tmp/evaluate-out/metadata.json || true

      - name: Upload evaluate results artifact
        if: always() && steps.fetch.outcome == 'success'
        # actions/upload-artifact pinned to 043fb46d (= refs/tags/v7.0.1 as of 2026-07-30).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submission-results
          path: /tmp/evaluate-out/*
          if-no-files-found: warn
          retention-days: 7

  archive_server:
    # The reusable job is the hard authority boundary around the Encrypt-only
    # AWS role and KMS-backed server archive path.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/server-archive.yml
    with:
      workflow_commit: ${{ inputs.workflow_commit }}
      submission_id: ${{ inputs.submission_id }}
      source_repository: ${{ inputs.source_repository }}
      callback_environment: ${{ inputs.callback_environment }}
    secrets:
      LEAN_EVAL_BOT_CLIENT_ID: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
      LEAN_EVAL_BOT_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}
      LEAN_EVAL_ARCHIVER_CLIENT_ID: ${{ secrets.LEAN_EVAL_ARCHIVER_CLIENT_ID }}
      LEAN_EVAL_ARCHIVER_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_ARCHIVER_PRIVATE_KEY }}

  archive:
    # Preserve the output/result contract consumed by evaluation and callbacks
    # while exposing only the server archive lane.
    needs: archive_server
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      fetch_succeeded: ${{ steps.select.outputs.fetch_succeeded }}
      size_within_cap: ${{ steps.select.outputs.size_within_cap }}
      audit_ciphertext_ready: ${{ steps.select.outputs.audit_ciphertext_ready }}
      source_metadata_sha256: ${{ steps.select.outputs.source_metadata_sha256 }}
      benchmark_commit: ${{ steps.select.outputs.benchmark_commit }}
      toolchain: ${{ steps.select.outputs.toolchain }}
    steps:
      - name: Select archive lane outputs
        id: select
        env:
          SERVER_FETCH_SUCCEEDED: ${{ needs.archive_server.outputs.fetch_succeeded }}
          SERVER_SIZE_WITHIN_CAP: ${{ needs.archive_server.outputs.size_within_cap }}
          SERVER_AUDIT_CIPHERTEXT_READY: ${{ needs.archive_server.outputs.audit_ciphertext_ready }}
          SERVER_SOURCE_METADATA_SHA256: ${{ needs.archive_server.outputs.source_metadata_sha256 }}
          SERVER_BENCHMARK_COMMIT: ${{ needs.archive_server.outputs.benchmark_commit }}
          SERVER_TOOLCHAIN: ${{ needs.archive_server.outputs.toolchain }}
        run: |
          set -euo pipefail
          for name in FETCH_SUCCEEDED SIZE_WITHIN_CAP AUDIT_CIPHERTEXT_READY SOURCE_METADATA_SHA256 BENCHMARK_COMMIT TOOLCHAIN; do
            variable="SERVER_${name}"
            printf '%s=%s\n' "$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')" "${!variable}" >> "$GITHUB_OUTPUT"
          done

      - name: Require selected archive lane success
        env:
          SERVER_RESULT: ${{ needs.archive_server.result }}
        run: |
          set -euo pipefail
          test "$SERVER_RESULT" = success

  archive_failure_state:
    needs: archive
    if: |
      always()
      && needs.archive.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - name: Record archive failure in State
        env:
          AUDIT_CIPHERTEXT_READY: ${{ needs.archive.outputs.audit_ciphertext_ready }}
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          FETCH_SUCCEEDED: ${{ needs.archive.outputs.fetch_succeeded }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SIZE_WITHIN_CAP: ${{ needs.archive.outputs.size_within_cap }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/archive-failed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/archive-failed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          if [ "$FETCH_SUCCEEDED" = "false" ]; then
            reason_code="source_fetch_failed"
            retryable="true"
          elif [ "$SIZE_WITHIN_CAP" = "false" ]; then
            reason_code="source_size_limit_exceeded"
            retryable="false"
          elif [ "$SIZE_WITHIN_CAP" = "true" ] && [ "$AUDIT_CIPHERTEXT_READY" != "true" ]; then
            reason_code="archive_encryption_failed"
            retryable="true"
          else
            reason_code="archive_persist_failed"
            retryable="true"
          fi
          failure_file=$(mktemp)
          OCCURRED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
          REASON_CODE="$reason_code" RETRYABLE="$retryable" \
          python3 - "$failure_file" <<'PY'
          import json
          import os
          import sys

          payload = {
              "schema_version": 1,
              "submission_id": os.environ["SUBMISSION_ID"],
              "occurred_at": os.environ["OCCURRED_AT"],
              "reason_code": os.environ["REASON_CODE"],
              "retryable": os.environ["RETRYABLE"] == "true",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$failure_file" \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("archive failure callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("archive failure callback confirmed the wrong submission")
          PY

  archive_state:
    needs: archive
    if: |
      always()
      && needs.archive.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-archive-completion
          path: /tmp/archive-completion

      - name: Record verified archive completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/archive-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/archive-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/archive-completion/archive-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("archive completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("archive completion callback confirmed the wrong submission")
          PY

  evaluation_state:
    needs: [evaluate, archive, archive_state]
    if: |
      always()
      && needs.archive_state.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-archive-completion
          path: /tmp/archive-completion

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: results_download
        continue-on-error: true
        with:
          name: submission-results
          path: /tmp/evaluation-results

      - name: Build trusted evaluation completion
        env:
          BENCHMARK_COMMIT: ${{ needs.evaluate.outputs.benchmark_commit }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          EVALUATOR_VERSION: ${{ github.sha }}
          PROBLEM_ID: ${{ inputs.problem_id }}
          TOOLCHAIN: ${{ needs.evaluate.outputs.toolchain }}
        run: |
          set -euo pipefail
          results_flag=()
          if [ -f /tmp/evaluation-results/results.json ]; then
            results_flag+=(--results /tmp/evaluation-results/results.json)
          fi
          python3 scripts/build_evaluation_completion.py \
            --archive-completion /tmp/archive-completion/archive-completion.json \
            --evaluate-result "$EVALUATE_RESULT" \
            --problem-id "$PROBLEM_ID" \
            --benchmark-commit "$BENCHMARK_COMMIT" \
            --toolchain "$TOOLCHAIN" \
            --evaluator-version "$EVALUATOR_VERSION" \
            --output /tmp/evaluation-completion.json \
            "${results_flag[@]}"

      - name: Record evaluation completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/evaluation-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/evaluation-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/evaluation-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("evaluation completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("evaluation completion callback confirmed the wrong submission")
          PY

  record:
    # Now gated on `archive` as well: if the audit archival did not
    # complete, the leaderboard must not advance either. The two
    # mechanisms are independent, but our policy is that a recorded
    # leaderboard entry implies a durable archived copy of the source.
    needs: [evaluate, archive, archive_state, evaluation_state]
    # Override Actions' implicit status check while keeping every required
    # server lifecycle dependency explicit.
    if: |
      always()
      && needs.evaluate.result == 'success'
      && needs.archive.result == 'success'
      && needs.evaluation_state.result == 'success'
    runs-on: ubuntu-latest
    # A live schema migration installs a durable Git lock. Evaluation and
    # archival remain live while this credentialed writer waits its turn.
    timeout-minutes: 45
    env:
      RESULTS_STORE_WRITER_GROUP: results-store-writer
      RESULTS_BRANCH: ${{ inputs.callback_environment == 'staging' && 'staging-results' || 'main' }}
    permissions:
      actions: read
      contents: read
    outputs:
      result_receipt_ready: ${{ steps.result_receipt.outputs.ready }}
    steps:
      # Two checkouts of this repo. `code/` is read-only and pinned to
      # this workflow's own SHA: it supplies scripts/update_leaderboard.py
      # and must NOT be touched by the push-retry loop. `results-store/`
      # is the writable working copy the loop resets/commits/pushes — so
      # the loop can reset to the selected Results branch without yanking the
      # script out from under the running process.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: code

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # actions/download-artifact pinned to 3e5f45b2 (= refs/tags/v8.0.1 as of 2026-07-30).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-results
          path: /tmp/submission-results

      # The writable results store. Checked out with the lean-eval-recorder
      # App token so the `record:` push to this repo's protected production or
      # staging Results branch bypasses its ruleset (the App is the bypass actor;
      # see docs/ci-secrets.md).
      - name: Mint lean-eval-recorder installation token
        id: recorder_token
        # actions/create-github-app-token pinned to bcd2ba49 (= refs/tags/v3.2.0 as of 2026-07-30).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.LEAN_EVAL_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_RECORDER_PRIVATE_KEY }}

      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.recorder_token.outputs.token }}
          ref: ${{ inputs.callback_environment == 'staging' && 'staging-results' || 'main' }}
          # The push-retry loop below authenticates through .git/config.
          persist-credentials: true
          path: results-store

      - name: Configure git identity
        run: |
          git -C results-store config user.email "lean-eval-bot@users.noreply.github.com"
          git -C results-store config user.name "lean-eval-bot"

      - name: Record submission with push-retry
        env:
          METADATA_PATH: /tmp/submission-results/metadata.json
          RESULTS_PATH: /tmp/submission-results/results.json
          SUMMARY_PATH: /tmp/submission-results/summary.json
          BENCHMARK_COMMIT: ${{ needs.evaluate.outputs.benchmark_commit }}
        run: |
          set -euo pipefail
          if [ ! -f "$METADATA_PATH" ] || [ ! -f "$RESULTS_PATH" ]; then
            echo "missing metadata or results artifact; evaluate likely failed"
            exit 1
          fi

          # Read frozen metadata fields
          SUBMITTED_BY=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submitted_by'])" "$METADATA_PATH")
          MODEL=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['model'])" "$METADATA_PATH")
          SUBMISSION_KIND=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_kind'])" "$METADATA_PATH")
          SUBMISSION_REPO=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_repo'])" "$METADATA_PATH")
          SUBMISSION_REF=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_ref'])" "$METADATA_PATH")
          SUBMISSION_PUBLIC=$(python -c "import json,sys; print(str(json.load(open(sys.argv[1]))['submission_public']).lower())" "$METADATA_PATH")
          PRODUCTION_DESCRIPTION=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('production_description') or '')" "$METADATA_PATH")
          SOLUTION_PUBLICATION_STATUS=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('solution_publication_status') or '')" "$METADATA_PATH")
          SOLUTION_PUBLICATION_DATE=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('solution_publication_date') or '')" "$METADATA_PATH")
          SUBMISSION_ID=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('submission_id') or '')" "$METADATA_PATH")
          PROBLEM_ID=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('problem_id') or '')" "$METADATA_PATH")
          STATEMENT_REVISION=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('statement_revision') or '')" "$METADATA_PATH")
          PRODUCTION_METADATA_JSON=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d.get('production_metadata') or {}, separators=(',', ':')))" "$METADATA_PATH")
          if [ "$SUBMISSION_PUBLIC" = "true" ]; then
            PUBLIC_FLAG="--submission-public"
          else
            PUBLIC_FLAG="--no-submission-public"
          fi
          DESCRIPTION_ARGS=()
          if [ -n "$PRODUCTION_DESCRIPTION" ]; then
            DESCRIPTION_ARGS+=(--production-description "$PRODUCTION_DESCRIPTION")
          fi
          PUBLICATION_ARGS=()
          if [ -n "$SOLUTION_PUBLICATION_STATUS" ]; then
            PUBLICATION_ARGS+=(--solution-publication-status "$SOLUTION_PUBLICATION_STATUS")
          fi
          if [ -n "$SOLUTION_PUBLICATION_DATE" ]; then
            PUBLICATION_ARGS+=(--solution-publication-date "$SOLUTION_PUBLICATION_DATE")
          fi
          INTAKE_ARGS=(
            --submission-id "$SUBMISSION_ID"
            --expected-problem-id "$PROBLEM_ID"
            --expected-statement-revision "$STATEMENT_REVISION"
            --production-metadata-json "$PRODUCTION_METADATA_JSON"
          )

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            # GitHub Actions concurrency groups are not FIFO: a third queued
            # run cancels the older pending run. Use the named durable lock
            # for record jobs instead, while migration workflow runs with the
            # same results-store-writer contract. A push race is safe: either
            # this record lands first or its push is rejected and the next
            # iteration observes the lock.
            for wait_attempt in $(seq 1 120); do
              git -C results-store fetch origin "$RESULTS_BRANCH"
              git -C results-store reset --hard "origin/$RESULTS_BRANCH"
              if [ ! -f results-store/.results-store-writer-lock.json ]; then
                break
              fi
              python -c 'import json,os; d=json.load(open("results-store/.results-store-writer-lock.json")); assert d["group"] == os.environ["RESULTS_STORE_WRITER_GROUP"]'
              echo "results migration holds $RESULTS_STORE_WRITER_GROUP; waiting ($wait_attempt/120)"
              sleep 15
            done
            if [ -f results-store/.results-store-writer-lock.json ]; then
              echo "timed out waiting for $RESULTS_STORE_WRITER_GROUP"
              exit 1
            fi

            OUTPUT=$(python code/scripts/update_leaderboard.py \
              --user "$SUBMITTED_BY" \
              --leaderboard-dir results-store \
              --results-json "$RESULTS_PATH" \
              --benchmark-commit "$BENCHMARK_COMMIT" \
              --submission-kind "$SUBMISSION_KIND" \
              --submission-repo "$SUBMISSION_REPO" \
              --submission-ref "$SUBMISSION_REF" \
              $PUBLIC_FLAG \
              --model "$MODEL" \
              "${INTAKE_ARGS[@]}" \
              "${DESCRIPTION_ARGS[@]}" \
              "${PUBLICATION_ARGS[@]}")

            CHANGED=$(python -c "import json,sys; print(json.loads(sys.argv[1])['changed'])" "$OUTPUT")
            if [ "$CHANGED" != "True" ]; then
              echo "no new records to commit"
              break
            fi

            COMMIT_MSG=$(python -c "import json,sys; print(json.loads(sys.argv[1])['commit_message'])" "$OUTPUT")
            git -C results-store add results/
            git -C results-store commit -m "$COMMIT_MSG"
            if git -C results-store push origin "HEAD:$RESULTS_BRANCH"; then
              echo "results push succeeded on attempt $attempt"
              break
            fi
            echo "results push rejected on attempt $attempt; retrying"
            sleep $((attempt * 2))
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              exit 1
            fi
          done

      - name: Detect accepted server result
        id: accepted_result
        env:
          PROBLEM_ID: ${{ inputs.problem_id }}
          RESULTS_PATH: /tmp/submission-results/results.json
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESULTS_PATH"], encoding="utf-8") as stream:
              results = json.load(stream)
          accepted = os.environ["PROBLEM_ID"] in results.get("passed", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"accepted={str(accepted).lower()}\n")
          PY

      - name: Build exact Results receipt
        id: result_receipt
        if: steps.accepted_result.outputs.accepted == 'true'
        env:
          DECLARED_MODEL: ${{ inputs.declared_model }}
          PROBLEM_ID: ${{ inputs.problem_id }}
          STATEMENT_REVISION: ${{ inputs.statement_revision }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          SUBMITTED_BY: ${{ inputs.submitted_by }}
        run: |
          set -euo pipefail
          occurred_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          result_commit=$(git -C results-store rev-parse HEAD)
          python code/scripts/build_result_receipt.py \
            --results-file "results-store/results/${SUBMITTED_BY}.json" \
            --results-root results-store \
            --submission-id "$SUBMISSION_ID" \
            --user "$SUBMITTED_BY" \
            --declared-model "$DECLARED_MODEL" \
            --problem-id "$PROBLEM_ID" \
            --statement-revision "$STATEMENT_REVISION" \
            --result-branch "$RESULTS_BRANCH" \
            --result-commit "$result_commit" \
            --occurred-at "$occurred_at" \
            --output /tmp/result-completion.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload source-free Results receipt
        if: steps.result_receipt.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submission-result-completion
          path: /tmp/result-completion.json
          if-no-files-found: error
          retention-days: 7

      - name: Redeploy leaderboard
        if: inputs.callback_environment == 'production'
        # Fire a repository_dispatch so the leaderboard rebuilds with the
        # new result. Best-effort: if the dispatch fails AFTER the result
        # push succeeded, the data advanced but the site did not — surface
        # an operator-actionable warning rather than failing the record job.
        env:
          DISPATCH_TOKEN: ${{ secrets.LEADERBOARD_WRITE_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -uo pipefail
          if GH_TOKEN="$DISPATCH_TOKEN" gh api repos/leanprover/lean-eval-leaderboard/dispatches \
              -X POST \
              -F event_type=results-advanced \
              -F "client_payload[submission_id]=$SUBMISSION_ID"; then
            echo "leaderboard redeploy dispatched"
          else
            echo "::warning::leaderboard redeploy dispatch failed"
          fi

  result_state:
    needs: [evaluation_state, record]
    if: |
      always()
      && needs.evaluation_state.result == 'success'
      && needs.record.result == 'success'
      && needs.record.outputs.result_receipt_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-result-completion
          path: /tmp/result-completion

      - name: Record verified result completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/result-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/result-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/result-completion/result-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {
              "recorded",
              "already_recorded",
              "result_identity_conflicted",
              "already_result_identity_conflicted",
          }:
              raise SystemExit("result completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("result completion callback confirmed the wrong submission")
          if not isinstance(payload.get("result_id"), str):
              raise SystemExit("result completion callback omitted the result identity")
          PY
