# Auth (lean-eval-bot GitHub App, lean-eval-recorder GitHub App, and
# LEADERBOARD_WRITE_TOKEN PAT) is documented in docs/ci-secrets.md.
#
# Security model: untrusted submitter Lean code is ONLY ever elaborated
# inside Lake comparator's bubblewrap sandbox (invoked from `lake test` via
# WorkspaceTest.lean). The non-negotiable invariants of this workflow
# (`APP_INSTALLATION_TOKEN` scoped to each job's single source-fetch
# step, .git stripped from BOTH evaluation checkouts before lake runs,
# `_prime_workspace` not pre-building any user-controlled targets, etc.)
# are documented in SECURITY.md. Read that section before editing this
# file or `scripts/evaluate_submission.py`.
#
# The trusted `archive` job independently fetches, encrypts, and durably
# persists the exact source before evaluation starts. The `evaluate` job
# then independently fetches that frozen commit and evaluates it on the
# same runner. A previous version uploaded cloned source as a workflow
# artifact, but artifacts from this public repository can expose private
# submissions. No plaintext source crosses jobs; do not replace either
# exact fetch with a source artifact.
#
# Two checkouts: this repo (lean-eval-submissions) supplies the
# pipeline scripts; `leanprover/lean-eval` supplies the benchmark
# (generated/ workspaces, manifests/, the `lean-eval` Lean CLI). The
# submission is scored against `leanprover/lean-eval@main` HEAD and the
# resolved SHA is recorded as `benchmark_commit`.
name: Submission

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      workflow_commit: {description: 'Commit encoded in the immutable dispatch tag', required: true, type: string}
      submission_id: {description: 'Canonical UUIDv7 allocated by the Worker', required: true, type: string}
      submitted_by: {description: 'Verified lowercase GitHub login', required: true, type: string}
      source_repository: {description: 'Canonical owner/repository', required: true, type: string}
      source_commit: {description: 'Exact lowercase 40-character commit', required: true, type: string}
      source_visibility: {description: 'Worker-verified public or private', required: true, type: string}
      problem_id: {description: 'Canonical problem identifier', required: true, type: string}
      problem_group: {description: 'Catalog policy group', required: true, type: string}
      statement_revision: {description: 'Positive catalog statement revision', required: true, type: string}
      declared_model: {description: 'Verbatim declared model', required: true, type: string}
      publication_choice: {description: 'scheduled or withheld', required: true, type: string}
      production_metadata_json: {description: 'Strict bounded production metadata object', required: true, type: string}
      archive_locator_required: {description: 'Must be literal true', required: true, type: string}
      archive_sidecar_schema: {description: 'Must be literal 3', required: true, type: string}
      archive_state_callback_required: {description: 'Must be literal true', required: true, type: string}
      callback_environment:
        description: 'Worker environment receiving trusted lifecycle callbacks'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  # Per-issue concurrency: each submission issue gets its own group so
  # parallel submissions from the same user do not cancel each other.
  # GitHub keeps at most 1 running + 1 pending per group, and any newer
  # pending run cancels the previously-pending one — which manifested as
  # silent dropouts when several issues were filed in quick succession.
  # Concurrent leaderboard pushes from sibling runs are already handled
  # by the `record` job's push-retry loop below.
  group: submission-${{ github.event_name == 'workflow_dispatch' && inputs.submission_id || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # The web Issue Form applies `submission` itself. GitHub's issue API drops
  # labels requested by authors without triage permission, so an API-created
  # issue arrives unlabeled. For opened issues only, validate the current form
  # shape and restore the routing label before allowing this same run to
  # evaluate it. GITHUB_TOKEN-authored events do not recursively start another
  # workflow run, hence the explicit output consumed by `evaluate` below.
  intake:
    if: >-
      github.event.action == 'opened' &&
      startsWith(github.event.issue.title, '[submission]') &&
      !contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      evaluate: ${{ steps.label.outputs.evaluate }}
    steps:
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # Issue Form labels can land just after the opened event. Query current
      # state so the UI's ordinary labeled-event run remains the sole evaluator.
      - name: Check current submission label
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --json labels --jq 'any(.labels[]; .name == "submission")' \
            | sed 's/^/labeled=/' >> "$GITHUB_OUTPUT"

      - name: Validate API-created submission
        if: steps.current.outputs.labeled != 'true'
        run: python scripts/validate_submission_intake.py --event-path "$GITHUB_EVENT_PATH"

      - name: Apply submission label
        id: label
        if: steps.current.outputs.labeled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label submission
          echo "evaluate=true" >> "$GITHUB_OUTPUT"

  evaluate_standard:
    needs: [intake, archive, archive_state]
    if: >-
      !cancelled() &&
      needs.archive.result == 'success' &&
      (github.event_name == 'issues' || needs.archive_state.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action == 'labeled' && github.event.label.name == 'submission') ||
       (github.event.action == 'opened' && needs.intake.outputs.evaluate == 'true'))
    uses: ./.github/workflows/evaluate-attempt.yml
    permissions:
      contents: read
    with:
      runner_tier: standard
      benchmark_commit: ${{ needs.archive.outputs.benchmark_commit }}
      toolchain: ${{ needs.archive.outputs.toolchain }}
      source_metadata_sha256: ${{ needs.archive.outputs.source_metadata_sha256 }}
      source_commit: ${{ needs.archive.outputs.source_commit }}
      workflow_commit: ${{ inputs.workflow_commit }}
      callback_environment: ${{ inputs.callback_environment }}
      archive_state_callback_required: ${{ inputs.archive_state_callback_required }}
      source_repository: ${{ inputs.source_repository }}
      problem_id: ${{ inputs.problem_id }}
      statement_revision: ${{ inputs.statement_revision }}
    secrets:
      LEAN_EVAL_BOT_CLIENT_ID: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
      LEAN_EVAL_BOT_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}

  escalation:
    needs: [evaluate_standard, archive]
    # Optional escalation cannot invalidate a completed standard evaluation.
    continue-on-error: true
    if: ${{ !cancelled() && needs.archive.result == 'success' && needs.evaluate_standard.result != 'skipped' && needs.evaluate_standard.outputs.succeeded != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      retry: ${{ steps.decide.outputs.retry }}
      allowlist_required: ${{ steps.decide.outputs.allowlist_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: submission-results-standard
          path: /tmp/standard-results
      - name: Decide whether to escalate
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMITTER: ${{ github.event_name == 'workflow_dispatch' && inputs.submitted_by || github.event.issue.user.login }}
        run: |
          set -euo pipefail
          # Policy follows protected main; adding a username needs no Worker redeploy.
          gh api "repos/$GITHUB_REPOSITORY/contents/configuration/large-runner-allowlist.json?ref=main" \
            -H 'Accept: application/vnd.github.raw+json' > /tmp/allowlist.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          python scripts/large_runner_retry.py \
            --submitter "$SUBMITTER" --allowlist /tmp/allowlist.json \
            --jobs /tmp/jobs.json \
            --report /tmp/standard-results/resource-report.json \
            --output /tmp/retry-decision.json >> "$GITHUB_OUTPUT"
      - name: Explain escalation decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c 'import json; print(json.load(open("/tmp/retry-decision.json"))["message"])' > /tmp/retry-message.txt
          if [ "$(wc -c < /tmp/retry-message.txt)" -gt 1 ]; then
            cat /tmp/retry-message.txt >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT_NAME" = issues ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/retry-message.txt
            fi
          fi

  evaluate_large:
    needs: [escalation, archive]
    if: ${{ !cancelled() && needs.escalation.outputs.retry == 'true' }}
    uses: ./.github/workflows/evaluate-attempt.yml
    permissions:
      contents: read
    with:
      runner_tier: large
      benchmark_commit: ${{ needs.archive.outputs.benchmark_commit }}
      toolchain: ${{ needs.archive.outputs.toolchain }}
      source_metadata_sha256: ${{ needs.archive.outputs.source_metadata_sha256 }}
      source_commit: ${{ needs.archive.outputs.source_commit }}
      workflow_commit: ${{ inputs.workflow_commit }}
      callback_environment: ${{ inputs.callback_environment }}
      archive_state_callback_required: ${{ inputs.archive_state_callback_required }}
      source_repository: ${{ inputs.source_repository }}
      problem_id: ${{ inputs.problem_id }}
      statement_revision: ${{ inputs.statement_revision }}
    secrets:
      LEAN_EVAL_BOT_CLIENT_ID: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
      LEAN_EVAL_BOT_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}

  evaluate:
    # Normalize attempts before the one State callback and leaderboard write.
    needs: [evaluate_standard, escalation, evaluate_large, archive]
    if: ${{ !cancelled() && needs.archive.result == 'success' && needs.evaluate_standard.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      benchmark_commit: ${{ needs.archive.outputs.benchmark_commit }}
      toolchain: ${{ needs.archive.outputs.toolchain }}
      results_artifact: ${{ needs.escalation.outputs.retry == 'true' && 'submission-results-large' || 'submission-results-standard' }}
      allowlist_required: ${{ needs.escalation.outputs.allowlist_required }}
    steps:
      - name: Require a completed final evaluation
        env:
          STANDARD_SUCCEEDED: ${{ needs.evaluate_standard.outputs.succeeded }}
          LARGE_SUCCEEDED: ${{ needs.evaluate_large.outputs.succeeded }}
          RETRY: ${{ needs.escalation.outputs.retry }}
          ALLOWLIST_REQUIRED: ${{ needs.escalation.outputs.allowlist_required }}
        run: |
          if [ "$ALLOWLIST_REQUIRED" = true ]; then
            exit 1
          fi
          if [ "$RETRY" = true ]; then
            test "$LARGE_SUCCEEDED" = true
          else
            test "$STANDARD_SUCCEEDED" = true
          fi

  archive_issue:
    # Trusted precondition for evaluation. This job independently fetches the
    # requested source, freezes the benchmark/source identities, encrypts the
    # source, and persists it to lean-eval-audit. It never runs untrusted Lean.
    # This is the compatibility lane for Issue Form submissions. Server intake
    # uses the isolated KMS-backed reusable workflow below.
    needs: intake
    if: >-
      always() &&
      github.event_name == 'issues' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'submission') ||
       (github.event.action == 'opened' && needs.intake.outputs.evaluate == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    outputs:
      submission_metadata_valid: ${{ steps.metadata_status.outputs.valid }}
      fetch_succeeded: ${{ steps.fetch_status.outputs.succeeded }}
      size_within_cap: ${{ steps.size_status.outputs.within_cap }}
      audit_ciphertext_ready: ${{ steps.audit_status.outputs.ready }}
      source_metadata_sha256: ${{ steps.source_identity.outputs.metadata_sha256 }}
      source_commit: ${{ steps.source_identity.outputs.source_commit }}
      benchmark_commit: ${{ steps.benchmark.outputs.sha }}
      toolchain: ${{ steps.benchmark.outputs.toolchain }}
    steps:
      - name: Assert immutable server workflow ref
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          CALLBACK_REQUIRED: ${{ inputs.archive_state_callback_required }}
        run: |
          if [[ ! "$EXPECTED_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid expected workflow commit" >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_WORKFLOW_COMMIT" ]; then
            echo "dispatch tag no longer resolves to the expected workflow commit" >&2
            exit 1
          fi
          if [ "$CALLBACK_REQUIRED" != "true" ]; then
            echo "server dispatch did not require the State lifecycle callback" >&2
            exit 1
          fi
          if [ "$CALLBACK_ENVIRONMENT" != "staging" ] && [ "$CALLBACK_ENVIRONMENT" != "production" ]; then
            echo "server dispatch selected an invalid callback environment" >&2
            exit 1
          fi

      # This repo supplies the frozen fetch and archive implementations.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Freeze the benchmark before archiving. Evaluation checks out this
      # exact commit rather than independently racing lean-eval@main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval
          ref: main
          path: lean-eval
          persist-credentials: false

      - name: Freeze benchmark identity
        id: benchmark
        run: |
          echo "sha=$(git -C lean-eval rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(cat lean-eval/lean-toolchain)" >> "$GITHUB_OUTPUT"

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # Parse and validate only user-supplied fields before any authenticated
      # source access. This keeps impossible dates and malformed form values
      # distinct from repository/App-access failures.
      - name: Validate submitted metadata
        id: submission_metadata
        run: |
          python scripts/fetch_submission.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --validate-issue-metadata-only \
            2> /tmp/submission-metadata-error.txt

      - name: Record submitted metadata status
        id: metadata_status
        if: always()
        run: |
          if [ "${{ steps.submission_metadata.outcome }}" = "success" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.submission_metadata.outcome }}" = "failure" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=not_attempted" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on invalid submitted metadata
        if: failure() && steps.submission_metadata.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERROR=$(python - <<'PY'
          from pathlib import Path

          raw = Path("/tmp/submission-metadata-error.txt").read_text(encoding="utf-8")
          print(" ".join(raw.split())[:2000])
          PY
          )
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "❌ Submission rejected before archival: the submitted metadata is invalid. ${ERROR}"
          gh issue close ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" --reason "not planned" || true

      - name: Extract source owner from issue body
        id: archive_owner
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SERVER_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              repository = os.environ.get("SERVER_SOURCE_REPOSITORY", "")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  sys.exit("invalid server source repository")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("kind=github_repo\n")
                  fh.write(f"owner={repository.split('/', 1)[0]}\n")
              raise SystemExit(0)
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(
              r"^###\s+Submission URL\s*\n+(?P<value>.+?)(?=\n+###\s|\Z)",
              body,
              re.MULTILINE | re.DOTALL,
          )
          if not m:
              sys.exit("no Submission URL section in issue body")
          url = m.group("value").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              repo = re.match(r"https://github\.com/([^/]+)/", url)
              if repo:
                  fh.write("kind=github_repo\n")
                  fh.write(f"owner={repo.group(1)}\n")
              elif url.startswith("https://gist.github.com/"):
                  fh.write("kind=gist\n")
                  fh.write("owner=\n")
              else:
                  sys.exit(f"unsupported URL in issue body: {url!r}")
          PY

      - name: Mint lean-eval-bot installation token for archival fetch
        id: archive_app_token
        if: steps.archive_owner.outputs.kind == 'github_repo'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        continue-on-error: true
        with:
          client-id: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}
          owner: ${{ steps.archive_owner.outputs.owner }}

      - name: Clean archive scratch dirs
        run: rm -rf /tmp/archive-fetch /tmp/archive-encrypt

      - name: Free disk space before fetching large archives
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Fetch source for archive
        id: archive_fetch
        env:
          APP_INSTALLATION_TOKEN: ${{ steps.archive_app_token.outputs.token }}
        run: |
          SERVER_FLAG=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVER_FLAG+=(--server-dispatch)
          fi
          python scripts/fetch_submission.py \
            --event-path "$GITHUB_EVENT_PATH" \
            "${SERVER_FLAG[@]}" \
            --output-dir /tmp/archive-fetch

      - name: Record archive fetch status
        id: fetch_status
        if: always()
        run: |
          if [ "${{ steps.archive_fetch.outcome }}" = "success" ]; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.archive_fetch.outcome }}" = "failure" ]; then
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
          else
            echo "succeeded=not_attempted" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze source identity
        id: source_identity
        if: steps.archive_fetch.outcome == 'success'
        run: |
          echo "metadata_sha256=$(sha256sum /tmp/archive-fetch/metadata.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          python -c 'import json; print("source_commit=" + json.load(open("/tmp/archive-fetch/metadata.json"))["submission_ref"])' >> "$GITHUB_OUTPUT"

      - name: Comment on archive fetch failure
        if: failure() && steps.archive_fetch.outcome == 'failure' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "❌ Submission fetch failed before archival, so evaluation did not start. See the workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If your submission repo is private, make sure the \`lean-eval-bot\` GitHub App is installed on it."
          gh issue close ${{ github.event.issue.number }} --repo "${{ github.repository }}" --reason "not planned" || true

      - name: Check submission size cap
        id: size_check
        if: steps.archive_fetch.outcome == 'success'
        run: |
          python scripts/submission_limits.py \
            --source-tar /tmp/archive-fetch/source.tar.gz \
            --metadata /tmp/archive-fetch/metadata.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Record size-cap status
        id: size_status
        if: always()
        run: |
          if [ "${{ steps.size_check.outcome }}" = "success" ]; then
            echo "within_cap=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.size_check.outcome }}" = "failure" ]; then
            echo "within_cap=false" >> "$GITHUB_OUTPUT"
          else
            echo "within_cap=not_attempted" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on size cap failure
        if: failure() && steps.size_check.outcome == 'failure' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIZE_MB=$(( $(stat -c %s /tmp/archive-fetch/source.tar.gz) / 1000000 ))
          CAP_BYTES="${{ steps.size_check.outputs.cap_bytes }}"
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "❌ Submission rejected: the compressed source tarball is ${SIZE_MB} MB, over the ${CAP_BYTES}-byte audit-archive cap (1 GB by default; 10 GB for CFSG). The source was not archived or evaluated. Trim build artifacts, large fixtures, or unrelated files before resubmitting."
          gh issue close ${{ github.event.issue.number }} --repo "${{ github.repository }}" --reason "not planned" || true

      - name: Install age for audit encryption
        if: steps.size_check.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Encrypt submission for audit archive
        id: encrypt
        if: steps.size_check.outcome == 'success'
        run: |
          mkdir -p /tmp/archive-encrypt
          python scripts/archive_submission.py encrypt \
            --source-tar /tmp/archive-fetch/source.tar.gz \
            --metadata /tmp/archive-fetch/metadata.json \
            --recipients .audit/recipients.txt \
            --output-dir /tmp/archive-encrypt

      - name: Record audit-ciphertext readiness
        id: audit_status
        if: always()
        run: |
          if [ "${{ steps.encrypt.outcome }}" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint lean-eval-archiver installation token
        id: archiver_token
        if: steps.encrypt.outcome == 'success'
        # actions/create-github-app-token pinned to bcd2ba49 (= refs/tags/v3.2.0 as of 2026-07-30).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.LEAN_EVAL_ARCHIVER_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_ARCHIVER_PRIVATE_KEY }}
          owner: leanprover
          repositories: lean-eval-audit

      - name: Push to lean-eval-audit
        if: steps.encrypt.outcome == 'success'
        env:
          # Step-scoped and never co-resident with untrusted evaluation.
          ARCHIVER_TOKEN: ${{ steps.archiver_token.outputs.token }}
        run: |
          set -euo pipefail
          LOCATOR_FLAG=()
          COMPLETION_FLAG=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOCATOR_FLAG+=(--locator-output /tmp/archive-locator.json)
            COMPLETION_FLAG+=(--completion-output /tmp/archive-completion.json)
          fi
          python scripts/archive_submission.py push \
            --ciphertext /tmp/archive-encrypt/source.tar.gz.age \
            --sidecar /tmp/archive-encrypt/sidecar.partial.json \
            --benchmark-commit "${{ steps.benchmark.outputs.sha }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${LOCATOR_FLAG[@]}" \
            "${COMPLETION_FLAG[@]}"

      - name: Upload verified server archive locator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submission-archive-locator
          path: /tmp/archive-locator.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified server archive completion
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submission-archive-completion
          path: /tmp/archive-completion.json
          if-no-files-found: error
          retention-days: 7

  archive_server:
    # A reusable job is a hard authority boundary: only server dispatch enters
    # the environment carrying the Encrypt-only AWS role. The legacy issue
    # lane above never receives OIDC permission or KMS configuration.
    needs: intake
    if: always() && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/server-archive.yml
    with:
      workflow_commit: ${{ inputs.workflow_commit }}
      submission_id: ${{ inputs.submission_id }}
      source_repository: ${{ inputs.source_repository }}
      callback_environment: ${{ inputs.callback_environment }}
    secrets:
      LEAN_EVAL_BOT_CLIENT_ID: ${{ secrets.LEAN_EVAL_BOT_CLIENT_ID }}
      LEAN_EVAL_BOT_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_BOT_PRIVATE_KEY }}
      LEAN_EVAL_ARCHIVER_CLIENT_ID: ${{ secrets.LEAN_EVAL_ARCHIVER_CLIENT_ID }}
      LEAN_EVAL_ARCHIVER_PRIVATE_KEY: ${{ secrets.LEAN_EVAL_ARCHIVER_PRIVATE_KEY }}

  archive:
    # Normalize the mutually exclusive issue/server archive lanes into the
    # single output and result contract consumed by evaluation and callbacks.
    needs: [intake, archive_issue, archive_server]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'submission') ||
         (github.event.action == 'opened' && needs.intake.outputs.evaluate == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      submission_metadata_valid: ${{ steps.select.outputs.submission_metadata_valid }}
      fetch_succeeded: ${{ steps.select.outputs.fetch_succeeded }}
      size_within_cap: ${{ steps.select.outputs.size_within_cap }}
      audit_ciphertext_ready: ${{ steps.select.outputs.audit_ciphertext_ready }}
      source_metadata_sha256: ${{ steps.select.outputs.source_metadata_sha256 }}
      source_commit: ${{ steps.select.outputs.source_commit }}
      benchmark_commit: ${{ steps.select.outputs.benchmark_commit }}
      toolchain: ${{ steps.select.outputs.toolchain }}
    steps:
      - name: Select archive lane outputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_SUBMISSION_METADATA_VALID: ${{ needs.archive_issue.outputs.submission_metadata_valid }}
          ISSUE_FETCH_SUCCEEDED: ${{ needs.archive_issue.outputs.fetch_succeeded }}
          ISSUE_SIZE_WITHIN_CAP: ${{ needs.archive_issue.outputs.size_within_cap }}
          ISSUE_AUDIT_CIPHERTEXT_READY: ${{ needs.archive_issue.outputs.audit_ciphertext_ready }}
          ISSUE_SOURCE_COMMIT: ${{ needs.archive_issue.outputs.source_commit }}
          ISSUE_SOURCE_METADATA_SHA256: ${{ needs.archive_issue.outputs.source_metadata_sha256 }}
          ISSUE_BENCHMARK_COMMIT: ${{ needs.archive_issue.outputs.benchmark_commit }}
          ISSUE_TOOLCHAIN: ${{ needs.archive_issue.outputs.toolchain }}
          SERVER_SUBMISSION_METADATA_VALID: not_applicable
          SERVER_FETCH_SUCCEEDED: ${{ needs.archive_server.outputs.fetch_succeeded }}
          SERVER_SIZE_WITHIN_CAP: ${{ needs.archive_server.outputs.size_within_cap }}
          SERVER_AUDIT_CIPHERTEXT_READY: ${{ needs.archive_server.outputs.audit_ciphertext_ready }}
          SERVER_SOURCE_COMMIT: ${{ inputs.source_commit }}
          SERVER_SOURCE_METADATA_SHA256: ${{ needs.archive_server.outputs.source_metadata_sha256 }}
          SERVER_BENCHMARK_COMMIT: ${{ needs.archive_server.outputs.benchmark_commit }}
          SERVER_TOOLCHAIN: ${{ needs.archive_server.outputs.toolchain }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            prefix=SERVER
          else
            prefix=ISSUE
          fi
          for name in SUBMISSION_METADATA_VALID FETCH_SUCCEEDED SIZE_WITHIN_CAP AUDIT_CIPHERTEXT_READY SOURCE_METADATA_SHA256 SOURCE_COMMIT BENCHMARK_COMMIT TOOLCHAIN; do
            variable="${prefix}_${name}"
            printf '%s=%s\n' "$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')" "${!variable}" >> "$GITHUB_OUTPUT"
          done

      - name: Require selected archive lane success
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_RESULT: ${{ needs.archive_issue.result }}
          SERVER_RESULT: ${{ needs.archive_server.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$SERVER_RESULT" = success
          else
            test "$ISSUE_RESULT" = success
          fi

  archive_failure_state:
    needs: archive
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.archive.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - name: Record archive failure in State
        env:
          AUDIT_CIPHERTEXT_READY: ${{ needs.archive.outputs.audit_ciphertext_ready }}
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          FETCH_SUCCEEDED: ${{ needs.archive.outputs.fetch_succeeded }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SIZE_WITHIN_CAP: ${{ needs.archive.outputs.size_within_cap }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/archive-failed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/archive-failed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          if [ "$FETCH_SUCCEEDED" = "false" ]; then
            reason_code="source_fetch_failed"
            retryable="true"
          elif [ "$SIZE_WITHIN_CAP" = "false" ]; then
            reason_code="source_size_limit_exceeded"
            retryable="false"
          elif [ "$SIZE_WITHIN_CAP" = "true" ] && [ "$AUDIT_CIPHERTEXT_READY" != "true" ]; then
            reason_code="archive_encryption_failed"
            retryable="true"
          else
            reason_code="archive_persist_failed"
            retryable="true"
          fi
          failure_file=$(mktemp)
          OCCURRED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
          REASON_CODE="$reason_code" RETRYABLE="$retryable" \
          python3 - "$failure_file" <<'PY'
          import json
          import os
          import sys

          payload = {
              "schema_version": 1,
              "submission_id": os.environ["SUBMISSION_ID"],
              "occurred_at": os.environ["OCCURRED_AT"],
              "reason_code": os.environ["REASON_CODE"],
              "retryable": os.environ["RETRYABLE"] == "true",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$failure_file" \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("archive failure callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("archive failure callback confirmed the wrong submission")
          PY

  archive_state:
    needs: archive
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.archive.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-archive-completion
          path: /tmp/archive-completion

      - name: Record verified archive completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/archive-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/archive-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/archive-completion/archive-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("archive completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("archive completion callback confirmed the wrong submission")
          PY

  evaluation_state:
    needs: [evaluate, archive, archive_state]
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.archive_state.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-archive-completion
          path: /tmp/archive-completion

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: results_download
        continue-on-error: true
        with:
          name: ${{ needs.evaluate.outputs.results_artifact }}
          path: /tmp/evaluation-results

      - name: Build trusted evaluation completion
        env:
          BENCHMARK_COMMIT: ${{ needs.evaluate.outputs.benchmark_commit }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          ALLOWLIST_REQUIRED: ${{ needs.evaluate.outputs.allowlist_required }}
          EVALUATOR_VERSION: ${{ github.sha }}
          PROBLEM_ID: ${{ inputs.problem_id }}
          TOOLCHAIN: ${{ needs.evaluate.outputs.toolchain }}
        run: |
          set -euo pipefail
          results_flag=()
          if [ -f /tmp/evaluation-results/results.json ]; then
            results_flag+=(--results /tmp/evaluation-results/results.json)
          fi
          python3 scripts/build_evaluation_completion.py \
            --archive-completion /tmp/archive-completion/archive-completion.json \
            --evaluate-result "$EVALUATE_RESULT" \
            --problem-id "$PROBLEM_ID" \
            --benchmark-commit "$BENCHMARK_COMMIT" \
            --toolchain "$TOOLCHAIN" \
            --evaluator-version "$EVALUATOR_VERSION" \
            --allowlist-required "$ALLOWLIST_REQUIRED" \
            --output /tmp/evaluation-completion.json \
            "${results_flag[@]}"

      - name: Record evaluation completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/evaluation-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/evaluation-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/evaluation-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {"recorded", "already_recorded"}:
              raise SystemExit("evaluation completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("evaluation completion callback confirmed the wrong submission")
          PY

  record:
    # Now gated on `archive` as well: if the audit archival did not
    # complete, the leaderboard must not advance either. The two
    # mechanisms are independent, but our policy is that a recorded
    # leaderboard entry implies a durable archived copy of the source.
    needs: [evaluate, archive, archive_state, evaluation_state]
    # Labeled-event runs intentionally skip `intake`. Without an explicit
    # status function here, Actions' implicit `success()` also sees that
    # skipped ancestor and silently suppresses `record`, even after both
    # direct dependencies succeed. Override the implicit check while keeping
    # the evaluation-and-archive policy explicit.
    if: |
      always()
      && needs.evaluate.result == 'success'
      && needs.archive.result == 'success'
      && (github.event_name == 'issues' || needs.evaluation_state.result == 'success')
    runs-on: ubuntu-latest
    # A live schema migration installs a durable Git lock. Evaluation and
    # archival remain live while this credentialed writer waits its turn.
    timeout-minutes: 45
    env:
      RESULTS_STORE_WRITER_GROUP: results-store-writer
      RESULTS_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.callback_environment == 'staging' && 'staging-results' || 'main' }}
    permissions:
      contents: read
      issues: write
    outputs:
      result_receipt_ready: ${{ steps.result_receipt.outputs.ready }}
    steps:
      # Two checkouts of this repo. `code/` is read-only and pinned to
      # this workflow's own SHA: it supplies scripts/update_leaderboard.py
      # and must NOT be touched by the push-retry loop. `results-store/`
      # is the writable working copy the loop resets/commits/pushes — so
      # the loop can reset to the selected Results branch without yanking the
      # script out from under the running process.
      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: code

      # actions/setup-python pinned to 5fda3b95 (= refs/tags/v7.0.0 as of 2026-07-30).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      # actions/download-artifact pinned to 3e5f45b2 (= refs/tags/v8.0.1 as of 2026-07-30).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.evaluate.outputs.results_artifact }}
          path: /tmp/submission-results

      # The writable results store. Checked out with the lean-eval-recorder
      # App token so the `record:` push to this repo's protected production or
      # staging Results branch bypasses its ruleset (the App is the bypass actor;
      # see docs/ci-secrets.md).
      - name: Mint lean-eval-recorder installation token
        id: recorder_token
        # actions/create-github-app-token pinned to bcd2ba49 (= refs/tags/v3.2.0 as of 2026-07-30).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.LEAN_EVAL_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.LEAN_EVAL_RECORDER_PRIVATE_KEY }}

      # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.recorder_token.outputs.token }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.callback_environment == 'staging' && 'staging-results' || 'main' }}
          # The push-retry loop below authenticates through .git/config.
          persist-credentials: true
          path: results-store

      - name: Configure git identity
        run: |
          git -C results-store config user.email "lean-eval-bot@users.noreply.github.com"
          git -C results-store config user.name "lean-eval-bot"

      - name: Record submission with push-retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_PATH: /tmp/submission-results/metadata.json
          RESULTS_PATH: /tmp/submission-results/results.json
          SUMMARY_PATH: /tmp/submission-results/summary.json
          BENCHMARK_COMMIT: ${{ needs.evaluate.outputs.benchmark_commit }}
        run: |
          set -euo pipefail
          if [ ! -f "$METADATA_PATH" ] || [ ! -f "$RESULTS_PATH" ]; then
            echo "missing metadata or results artifact; evaluate likely failed"
            if [ "${{ github.event_name }}" = "issues" ]; then
              gh issue comment ${{ github.event.issue.number }} \
                --repo "${{ github.repository }}" \
                --body "❌ Evaluation did not produce results. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            exit 1
          fi

          # Read frozen metadata fields
          SUBMITTED_BY=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submitted_by'])" "$METADATA_PATH")
          MODEL=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['model'])" "$METADATA_PATH")
          SUBMISSION_KIND=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_kind'])" "$METADATA_PATH")
          SUBMISSION_REPO=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_repo'])" "$METADATA_PATH")
          SUBMISSION_REF=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['submission_ref'])" "$METADATA_PATH")
          SUBMISSION_PUBLIC=$(python -c "import json,sys; print(str(json.load(open(sys.argv[1]))['submission_public']).lower())" "$METADATA_PATH")
          PRODUCTION_DESCRIPTION=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('production_description') or '')" "$METADATA_PATH")
          SOLUTION_PUBLICATION_STATUS=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('solution_publication_status') or '')" "$METADATA_PATH")
          SOLUTION_PUBLICATION_DATE=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('solution_publication_date') or '')" "$METADATA_PATH")
          SUBMISSION_ID=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('submission_id') or '')" "$METADATA_PATH")
          PROBLEM_ID=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('problem_id') or '')" "$METADATA_PATH")
          STATEMENT_REVISION=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('statement_revision') or '')" "$METADATA_PATH")
          PRODUCTION_METADATA_JSON=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d.get('production_metadata') or {}, separators=(',', ':')))" "$METADATA_PATH")
          if [ "$SUBMISSION_PUBLIC" = "true" ]; then
            PUBLIC_FLAG="--submission-public"
          else
            PUBLIC_FLAG="--no-submission-public"
          fi
          DESCRIPTION_ARGS=()
          if [ -n "$PRODUCTION_DESCRIPTION" ]; then
            DESCRIPTION_ARGS+=(--production-description "$PRODUCTION_DESCRIPTION")
          fi
          PUBLICATION_ARGS=()
          if [ -n "$SOLUTION_PUBLICATION_STATUS" ]; then
            PUBLICATION_ARGS+=(--solution-publication-status "$SOLUTION_PUBLICATION_STATUS")
          fi
          if [ -n "$SOLUTION_PUBLICATION_DATE" ]; then
            PUBLICATION_ARGS+=(--solution-publication-date "$SOLUTION_PUBLICATION_DATE")
          fi
          INTAKE_ARGS=()
          if [ -n "$SUBMISSION_ID" ]; then
            INTAKE_ARGS+=(--submission-id "$SUBMISSION_ID")
            INTAKE_ARGS+=(--expected-problem-id "$PROBLEM_ID")
            INTAKE_ARGS+=(--expected-statement-revision "$STATEMENT_REVISION")
            INTAKE_ARGS+=(--production-metadata-json "$PRODUCTION_METADATA_JSON")
          else
            INTAKE_ARGS+=(--issue-number "${{ github.event.issue.number }}")
          fi

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            # GitHub Actions concurrency groups are not FIFO: a third queued
            # run cancels the older pending run. Use the named durable lock
            # for record jobs instead, while migration workflow runs with the
            # same results-store-writer contract. A push race is safe: either
            # this record lands first or its push is rejected and the next
            # iteration observes the lock.
            for wait_attempt in $(seq 1 120); do
              git -C results-store fetch origin "$RESULTS_BRANCH"
              git -C results-store reset --hard "origin/$RESULTS_BRANCH"
              if [ ! -f results-store/.results-store-writer-lock.json ]; then
                break
              fi
              python -c 'import json,os; d=json.load(open("results-store/.results-store-writer-lock.json")); assert d["group"] == os.environ["RESULTS_STORE_WRITER_GROUP"]'
              echo "results migration holds $RESULTS_STORE_WRITER_GROUP; waiting ($wait_attempt/120)"
              sleep 15
            done
            if [ -f results-store/.results-store-writer-lock.json ]; then
              echo "timed out waiting for $RESULTS_STORE_WRITER_GROUP"
              exit 1
            fi

            OUTPUT=$(python code/scripts/update_leaderboard.py \
              --user "$SUBMITTED_BY" \
              --leaderboard-dir results-store \
              --results-json "$RESULTS_PATH" \
              --benchmark-commit "$BENCHMARK_COMMIT" \
              --submission-kind "$SUBMISSION_KIND" \
              --submission-repo "$SUBMISSION_REPO" \
              --submission-ref "$SUBMISSION_REF" \
              $PUBLIC_FLAG \
              --model "$MODEL" \
              --verification-run-id "$GITHUB_RUN_ID" \
              --verification-run-attempt "$GITHUB_RUN_ATTEMPT" \
              "${INTAKE_ARGS[@]}" \
              "${DESCRIPTION_ARGS[@]}" \
              "${PUBLICATION_ARGS[@]}")

            CHANGED=$(python -c "import json,sys; print(json.loads(sys.argv[1])['changed'])" "$OUTPUT")
            if [ "$CHANGED" != "True" ]; then
              echo "no new records to commit"
              break
            fi

            COMMIT_MSG=$(python -c "import json,sys; print(json.loads(sys.argv[1])['commit_message'])" "$OUTPUT")
            git -C results-store add results/ verification/
            git -C results-store commit -m "$COMMIT_MSG"
            if git -C results-store push origin "HEAD:$RESULTS_BRANCH"; then
              echo "results push succeeded on attempt $attempt"
              break
            fi
            echo "results push rejected on attempt $attempt; retrying"
            sleep $((attempt * 2))
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              if [ "${{ github.event_name }}" = "issues" ]; then
                gh issue comment ${{ github.event.issue.number }} \
                  --repo "${{ github.repository }}" \
                  --body "⚠️ Could not push the result after $MAX_ATTEMPTS attempts (race). An operator will need to retry this submission."
              fi
              exit 1
            fi
          done

      - name: Detect accepted server result
        id: accepted_result
        if: github.event_name == 'workflow_dispatch'
        env:
          PROBLEM_ID: ${{ inputs.problem_id }}
          RESULTS_PATH: /tmp/submission-results/results.json
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESULTS_PATH"], encoding="utf-8") as stream:
              results = json.load(stream)
          accepted = os.environ["PROBLEM_ID"] in results.get("passed", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"accepted={str(accepted).lower()}\n")
          PY

      - name: Build exact Results receipt
        id: result_receipt
        if: steps.accepted_result.outputs.accepted == 'true'
        env:
          DECLARED_MODEL: ${{ inputs.declared_model }}
          PROBLEM_ID: ${{ inputs.problem_id }}
          STATEMENT_REVISION: ${{ inputs.statement_revision }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          SUBMITTED_BY: ${{ inputs.submitted_by }}
        run: |
          set -euo pipefail
          occurred_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          result_commit=$(git -C results-store rev-parse HEAD)
          python code/scripts/build_result_receipt.py \
            --results-file "results-store/results/${SUBMITTED_BY}.json" \
            --results-root results-store \
            --submission-id "$SUBMISSION_ID" \
            --user "$SUBMITTED_BY" \
            --declared-model "$DECLARED_MODEL" \
            --problem-id "$PROBLEM_ID" \
            --statement-revision "$STATEMENT_REVISION" \
            --result-branch "$RESULTS_BRANCH" \
            --result-commit "$result_commit" \
            --occurred-at "$occurred_at" \
            --output /tmp/result-completion.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload source-free Results receipt
        if: steps.result_receipt.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submission-result-completion
          path: /tmp/result-completion.json
          if-no-files-found: error
          retention-days: 7

      - name: Redeploy leaderboard
        if: github.event_name == 'issues' || inputs.callback_environment == 'production'
        # Fire a repository_dispatch so the leaderboard rebuilds with the
        # new result. Best-effort: if the dispatch fails AFTER the result
        # push succeeded, the data advanced but the site did not — surface
        # an operator-actionable comment rather than failing the job (which
        # would mislead the `notify` job into reporting a record failure).
        env:
          DISPATCH_TOKEN: ${{ secrets.LEADERBOARD_WRITE_TOKEN }}
          COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -uo pipefail
          if GH_TOKEN="$DISPATCH_TOKEN" gh api repos/leanprover/lean-eval-leaderboard/dispatches \
              -X POST \
              -F event_type=results-advanced \
              -F "client_payload[issue]=$ISSUE" \
              -F "client_payload[submission_id]=$SUBMISSION_ID"; then
            echo "leaderboard redeploy dispatched"
          else
            echo "::warning::leaderboard redeploy dispatch failed"
            if [ "${{ github.event_name }}" = "issues" ]; then
              GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$ISSUE" \
                --repo "${{ github.repository }}" \
                --body "⚠️ The result was recorded, but the leaderboard redeploy dispatch failed. An operator should re-run it: \`gh api repos/leanprover/lean-eval-leaderboard/dispatches -X POST -F event_type=results-advanced\`" || true
            fi
          fi

      - name: Comment submission summary
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_PATH: /tmp/submission-results/results.json
          SUMMARY_PATH: /tmp/submission-results/summary.json
        run: |
          set -euo pipefail
          BODY=$(python - <<'PY'
          import json, os
          results = json.load(open(os.environ["RESULTS_PATH"]))
          summary = json.load(open(os.environ["SUMMARY_PATH"]))
          lines = ["## Submission result", ""]
          passed = results.get("passed") or []
          if passed:
              lines.append(f"✅ Newly-solved problems: {', '.join(passed)}")
          else:
              lines.append("No new problems solved in this submission.")
          lines.append("")
          re = summary.get("run_eval") or {}
          total = re.get("total_problems", 0)
          attempted = re.get("attempted_problems", 0)
          succeeded = re.get("succeeded_problems", 0)
          lines.append(f"Attempted {attempted} / {total}; succeeded on {succeeded}.")
          lines.append("")
          lines.append("### Per-problem")
          for entry in (re.get("problems") or [])[:50]:
              status = "pass" if entry.get("succeeded") else (
                  "fail" if entry.get("attempted") else "skipped"
              )
              lines.append(f"- `{entry.get('id')}`: {status}")
          body = "\n".join(lines)
          CAP = 40000
          if len(body) > CAP:
              body = body[:CAP] + "\n\n...truncated..."
          print(body)
          PY
          )
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --reason "completed"

  result_state:
    needs: [evaluation_state, record]
    if: |
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.evaluation_state.result == 'success'
      && needs.record.result == 'success'
      && needs.record.outputs.result_receipt_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-${{ inputs.callback_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-result-completion
          path: /tmp/result-completion

      - name: Record verified result completion in State
        env:
          CALLBACK_ENVIRONMENT: ${{ inputs.callback_environment }}
          LIFECYCLE_CALLBACK_TOKEN: ${{ secrets.LIFECYCLE_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          case "$CALLBACK_ENVIRONMENT" in
            staging)
              endpoint="https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/result-completed"
              ;;
            production)
              endpoint="https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/result-completed"
              ;;
            *)
              echo "unsupported callback environment" >&2
              exit 1
              ;;
          esac
          response_file=$(mktemp)
          # State PAT secondary throttling can outlive a short transport retry.
          # Keep the idempotent payload fixed and retry once per minute for at most 15 minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 15 \
            --retry-delay 60 \
            --retry-max-time 900 \
            --retry-connrefused \
            --request POST \
            --header "Authorization: Bearer ${LIFECYCLE_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/result-completion/result-completion.json \
            --output "$response_file" \
            "$endpoint"
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("status") not in {
              "recorded",
              "already_recorded",
              "result_identity_conflicted",
              "already_result_identity_conflicted",
          }:
              raise SystemExit("result completion callback did not confirm State")
          if payload.get("submission_id") != os.environ["SUBMISSION_ID"]:
              raise SystemExit("result completion callback confirmed the wrong submission")
          if not isinstance(payload.get("result_id"), str):
              raise SystemExit("result completion callback omitted the result identity")
          PY

  # Catches the case where the archival fetch and size check succeeded but
  # archive persistence, evaluation, or recording did not complete cleanly.
  #
  # Suppressed only for an explicit source-fetch or size-cap rejection so we
  # do not duplicate those dedicated archive-job comments. A pre-fetch
  # infrastructure failure remains operator-visible.
  notify:
    needs: [intake, evaluate, archive, record, escalation]
    if: |
      always()
      && github.event_name == 'issues'
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'submission')
        || (github.event.action == 'opened' && needs.intake.outputs.evaluate == 'true')
      )
      && needs.escalation.outputs.allowlist_required != 'true'
      && needs.archive.outputs.submission_metadata_valid != 'false'
      && needs.archive.outputs.fetch_succeeded != 'false'
      && needs.archive.outputs.size_within_cap != 'false'
      && (
        needs.archive.result != 'success'
        || needs.evaluate.result != 'success'
        || needs.record.result != 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment on workflow failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          ARCHIVE_RESULT: ${{ needs.archive.result }}
          RECORD_RESULT: ${{ needs.record.result }}
          # Audit-encrypt failure prevents evaluation from starting.
          AUDIT_CIPHERTEXT_READY: ${{ needs.archive.outputs.audit_ciphertext_ready }}
          ARCHIVE_FETCH_SUCCEEDED: ${{ needs.archive.outputs.fetch_succeeded }}
          ARCHIVE_SIZE_WITHIN_CAP: ${{ needs.archive.outputs.size_within_cap }}
          EVALUATE_WHY: The evaluation pipeline failed; consult the selected attempt in the workflow logs.
          LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ARCHIVE_FETCH_SUCCEEDED" != "true" ] || [ "$ARCHIVE_SIZE_WITHIN_CAP" != "true" ]; then
            BODY="❌ Audit archival preparation did not complete; evaluation did not start and the leaderboard was not updated. An operator will need to investigate. See the workflow logs: $LOGS"
          elif [ "$AUDIT_CIPHERTEXT_READY" != "true" ]; then
            BODY="❌ Audit encryption of the submission did not complete; the submission was not evaluated and the leaderboard was not updated. An operator will need to investigate. See the workflow logs: $LOGS"
          elif [ "$ARCHIVE_RESULT" != "success" ]; then
            BODY="❌ Audit archival did not complete (archive job: $ARCHIVE_RESULT); evaluation did not start and the leaderboard was not updated. An operator will need to investigate. See the workflow logs: $LOGS"
          elif [ "$EVALUATE_RESULT" != "success" ]; then
            BODY="❌ Submission evaluation did not produce results. $EVALUATE_WHY See the workflow logs: $LOGS"
          else
            BODY="❌ Recording the submission to the leaderboard did not complete (record job: $RECORD_RESULT). An operator will need to investigate. See the workflow logs: $LOGS"
          fi
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "$BODY"
