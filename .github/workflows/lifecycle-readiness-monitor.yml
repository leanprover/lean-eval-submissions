name: Monitor lifecycle Cloudflare readiness

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: lifecycle-cloudflare-readiness-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python pinned to v7.0.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify one commit-coherent public deployment
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/lifecycle-health.json"
          python scripts/monitor_cloudflare_health.py \
            --intake-config server/wrangler.jsonc \
            --replay-config server/wrangler.replay.jsonc \
            --output "$report"
          deployed_commit=$(REPORT="$report" python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["REPORT"], encoding="utf-8") as source:
              report = json.load(source)
          commit = report.get("deployed_commit")
          if report.get("status") != "ready" or not isinstance(commit, str):
              raise SystemExit("monitor report is not ready")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("monitor commit is invalid")
          print(commit)
          PY
          )
          dispatch_ref="lean-eval-dispatch/$deployed_commit"
          resolved=$(gh api "repos/$REPOSITORY/git/ref/tags/$dispatch_ref" --jq .object.sha)
          if [ "$resolved" != "$deployed_commit" ]; then
            echo "deployed commit does not have its exact immutable dispatch tag" >&2
            exit 1
          fi
          status=$(gh api "repos/$REPOSITORY/compare/$deployed_commit...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "deployed commit is not reachable from protected main" >&2
            exit 1
          fi

      - name: Open, recover, or preserve the incident alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_OUTCOME: ${{ steps.verify.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[monitor] LeanEval lifecycle readiness failure'
          marker='<!-- lean-eval-lifecycle-monitor-v1 -->'
          number=$(gh issue list --repo "$REPOSITORY" --state all --limit 100 \
            --json number,title,body,state,author \
            --jq '.[] | select(.title == "[monitor] LeanEval lifecycle readiness failure") | select(.author.login == "github-actions[bot]") | select(.body | contains("<!-- lean-eval-lifecycle-monitor-v1 -->")) | .number' \
            | sed -n '1p')
          if [ "$MONITOR_OUTCOME" != "success" ]; then
            if [ -z "$number" ]; then
              body="$RUNNER_TEMP/lifecycle-monitor-issue.md"
              {
                echo "$marker"
                echo 'The public Cloudflare lifecycle deployment failed its commit-coherent readiness check.'
                echo
                echo "- Failed run: $RUN_URL"
                echo '- Severity owner and emergency intake-pause owner: @kim-em'
                echo '- Support channel: this repository issue'
                echo '- Immediate response: confirm production intake/replay state, pause intake if it is enabled, preserve evidence, and forward-deploy or complete the reviewed rollback unit.'
                echo
                echo 'No secret values, source bytes, or raw endpoint bodies are included in this alert.'
              } > "$body"
              gh issue create --repo "$REPOSITORY" --title "$title" --body-file "$body"
            else
              state=$(gh issue view "$number" --repo "$REPOSITORY" --json state --jq .state)
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number" --repo "$REPOSITORY"
                gh issue comment "$number" --repo "$REPOSITORY" \
                  --body "Readiness failed again: $RUN_URL"
              fi
            fi
            exit 1
          fi
          if [ -n "$number" ]; then
            state=$(gh issue view "$number" --repo "$REPOSITORY" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              gh issue comment "$number" --repo "$REPOSITORY" \
                --body "Readiness recovered: $RUN_URL"
              gh issue close "$number" --repo "$REPOSITORY" \
                --reason completed
            fi
          fi
