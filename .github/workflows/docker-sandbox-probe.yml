# TEMPORARY diagnostic for issue #1078. Delete once the question is settled.
#
# Landlock is not enabled on the Namespace runner kernel, so landrun cannot
# confine untrusted Lean there. This asks whether a container can take over
# that job instead: Namespace jobs run inside Docker already and expose a
# docker CLI, so the question is whether we can launch a *nested* container
# with the properties the sandbox actually needs.
#
# What we need from a replacement, in the order it matters:
#   1. filesystem: read-only everything except one writable build dir
#   2. no network
#   3. process-tree containment (kill the sandbox, kill every descendant --
#      the property landrun never had, see #1078 discussion)
#   4. resource limits, so a hostile submission cannot wedge the runner
#   5. the payload must not be able to reach the docker socket, or it can
#      trivially launch an unconfined container and escape
name: Docker sandbox probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, nscloud-ubuntu-24.04-amd64-32x64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: What kind of docker is this?
        run: |
          set +e
          echo "=== which docker ==="
          command -v docker; docker --version
          echo "=== daemon reachable? ==="
          docker info --format '{{.ServerVersion}} storage={{.Driver}} rootless={{.SecurityOptions}}' 2>&1 | head -3
          echo "=== is the socket a host socket? ==="
          ls -la /var/run/docker.sock 2>&1
          echo "=== are we already in a container? ==="
          systemd-detect-virt -c 2>&1 || true

      - name: Can we run a container at all, and how long does it cost?
        run: |
          set +e
          time docker run --rm alpine:3.21 true
          echo "plain-run exit=$?"

      - name: Does the sandbox shape hold?
        run: |
          set +e
          mkdir -p /tmp/build-out
          echo "=== 1. read-only rootfs denies a write outside the volume ==="
          docker run --rm --read-only --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=512 \
            -v /tmp/build-out:/work -w /work \
            alpine:3.21 sh -c 'touch /etc/ESCAPED'
          echo "  escape exit=$? (non-zero wanted)"
          echo "=== 2. the writable volume is writable ==="
          # As the runner's own uid: --cap-drop=ALL removes DAC_OVERRIDE,
          # so container root cannot write a volume the runner owns.
          docker run --rm --read-only --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=512 \
            --user "$(id -u):$(id -g)" \
            -v /tmp/build-out:/work -w /work \
            alpine:3.21 sh -c 'touch /work/inside && echo wrote'
          echo "  inside exit=$? (0 wanted)"
          test -e /tmp/build-out/inside && echo "  volume write landed on the host as expected"
          echo "=== 3. no network ==="
          docker run --rm --network=none alpine:3.21 \
            sh -c 'wget -q -T3 -O- https://example.com >/dev/null 2>&1'
          echo "  network exit=$? (non-zero wanted)"
          echo "=== 4. host filesystem is not visible ==="
          docker run --rm --read-only --network=none alpine:3.21 \
            sh -c 'ls /home/runner 2>&1 | head -2'
          echo "  (an error or empty listing is what we want)"
          echo "=== 5. the docker socket must NOT be reachable from inside ==="
          docker run --rm --read-only --network=none alpine:3.21 \
            sh -c 'test -S /var/run/docker.sock && echo REACHABLE || echo absent'

      - name: Process-tree containment
        run: |
          set +e
          echo "=== a detached child must not outlive the container ==="
          # setsid + a long sleep: the shape of the artifact-tampering
          # daemon that landrun's exec allowlist was supposed to prevent
          # and, per the #1078 discussion, does not.
          docker run --rm --network=none --name sandbox-probe -d \
            alpine:3.21 sh -c 'setsid sleep 300 & sleep 300'
          sleep 3
          docker kill sandbox-probe 2>/dev/null
          sleep 2
          echo "containers still alive:"; docker ps --format '{{.Names}}' | grep -c sandbox-probe || true
          echo "stray sleeps on the host:"; pgrep -c -f 'sleep 300' || true

      - name: Resource limits
        run: |
          set +e
          echo "=== memory cap is enforced ==="
          docker run --rm --memory=256m --network=none alpine:3.21 \
            sh -c 'dd if=/dev/zero of=/dev/shm/f bs=1M count=512 2>&1 | tail -1'
          echo "  exit=$? (non-zero / OOM wanted)"
          echo "=== how much memory can a container see? ==="
          docker run --rm --memory=8g --network=none alpine:3.21 free -m 2>&1 | head -3
