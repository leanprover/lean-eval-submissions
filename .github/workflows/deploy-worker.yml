name: Check and deploy submission Worker

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/submission.yml'
      - '.github/workflows/promotion-canary.yml'
      - '.github/workflows/server-archive.yml'
      - '.audit/**'
      - 'INFRASTRUCTURE.md'
      - 'scripts/**'
      - 'server/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/submission.yml'
      - '.github/workflows/promotion-canary.yml'
      - '.github/workflows/server-archive.yml'
      - '.audit/**'
      - 'scripts/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-worker-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node pinned to v6.5.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run types:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm run deploy:dry-run

  promote-dispatch-ref:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    environment: submission-dispatch-promotion
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.promote.outputs.ref }}
    steps:
      - name: Create or verify immutable workflow-dispatch tag
        id: promote
        env:
          APPROVAL_GUARD: ${{ secrets.DISPATCH_PROMOTION_APPROVAL_GUARD }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVAL_GUARD" =~ ^[0-9a-f]{64}$ ]]; then
            echo "reviewed dispatch-promotion environment is not configured" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow commit is not a full lowercase SHA" >&2
            exit 1
          fi
          status=$(gh api "repos/$REPOSITORY/compare/$WORKFLOW_COMMIT...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "workflow commit is not reachable from protected main" >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/contents/.github/workflows/submission.yml?ref=$WORKFLOW_COMMIT" \
            --jq .sha >/dev/null
          gh api "repos/$REPOSITORY/contents/.github/workflows/promotion-canary.yml?ref=$WORKFLOW_COMMIT" \
            --jq .sha >/dev/null

          tag="lean-eval-dispatch/$WORKFLOW_COMMIT"
          if existing=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$WORKFLOW_COMMIT" ]; then
              echo "dispatch tag collision: $tag resolves to $existing" >&2
              exit 1
            fi
          else
            gh api "repos/$REPOSITORY/git/refs" \
              -X POST \
              -f "ref=refs/tags/$tag" \
              -f "sha=$WORKFLOW_COMMIT" >/dev/null
          fi
          resolved=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          if [ "$resolved" != "$WORKFLOW_COMMIT" ]; then
            echo "dispatch tag read-back did not resolve to the reviewed commit" >&2
            exit 1
          fi
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: promote-dispatch-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - run: npm ci
      - name: Verify the staging Results branch protection gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$GITHUB_REPOSITORY/branches/staging-results" \
            --jq 'select(.name == "staging-results" and .protected == true) | .commit.sha')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "staging-results is missing, unprotected, or not commit-exact" >&2
            exit 1
          fi
      - name: Verify reviewed staging replay image manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ../scripts/verify_authoritative_replay_image_reference
          --config wrangler.replay.jsonc --environment staging
      - name: Deploy staging replay executor and container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.replay.jsonc --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Wait for the exact staging container rollout
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          python ../scripts/wait_replay_container_rollout.py
          --config wrangler.replay.jsonc
          --environment staging
          --application lean-eval-replay-executor-staging-replaysandbox-staging
      - name: Deploy staging GitHub broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.broker.jsonc --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Deploy staging submission Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
        run: >-
          npx wrangler deploy --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
          --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF"
      - name: Smoke-test staging
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: staging
        run: |
          for attempt in $(seq 1 13); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-submission-server-staging.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == os.environ["EXPECTED_ENVIRONMENT"]
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_configured_enabled"] is False
          assert body["intake_effective_enabled"] is False
          assert body["intake_enabled"] is False
          assert body["result_amendment_maintainer_api_enabled"] is False
          assert body["promotion_canary_configured_enabled"] is True
          assert body["promotion_canary_enabled"] is True
          assert body["intake_enablement_mode"] == "disabled"
          assert body["intake_lease_expires_at"] is None
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 13 ]; then sleep 5; fi
          done
          echo "health payload did not converge: $body" >&2
          exit 1
      - name: Smoke-test disabled staging replay executor
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 25); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-replay-executor-staging.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body == {
              "status": "ok",
              "service": "lean-eval-replay-executor",
              "environment": "staging",
              "deployed_commit": os.environ["EXPECTED_COMMIT"],
              "replay_enabled": False,
              "staging_acceptance_enabled": True,
              "staging_memory_limit_bytes": 12 * 1024**3,
              "production_memory_gate_bytes": 12 * 1024**3,
              "reviewed_execution_profile_digest": "fabd804359adbe7737e1db206d1877d3b923385cf2e8e95ec2b3be69a0d4c651",
              "reviewed_measurement_config_digest": "2dfc898270b83b6c99689e3f551a102c5e76636ec9f469a408498080e3e45945",
              "reviewed_vm_image_digest": "sha256:f61b6be446c3bc355c2eefddc3b376226acee89ca562e66f3b283576a32bb20b",
          }
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 25 ]; then sleep 5; fi
          done
          echo "replay health payload did not converge: $body" >&2
          exit 1

  staging-promotion-canary:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy-staging, promote-dispatch-ref]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: cloudflare-staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python pinned to v7.0.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - name: Prove the exact staging promotion boundary
        env:
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
        run: >-
          python ../scripts/run_staging_promotion_canary.py
          --commit "$GITHUB_SHA"
          --dispatch-ref "$DISPATCH_WORKFLOW_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --timeout-seconds 480
          --poll-seconds 5

  deploy-production:
    needs: [staging-promotion-canary, promote-dispatch-ref]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - run: npm ci
      - name: Read reviewed production intake state
        id: production-intake
        run: |
          set -euo pipefail
          intake_enabled=$(python ../scripts/worker_intake_configuration.py \
            --config wrangler.jsonc \
            --environment production)
          echo "enabled=$intake_enabled" >> "$GITHUB_OUTPUT"
      - name: Verify reviewed production replay image manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ../scripts/verify_authoritative_replay_image_reference
          --config wrangler.replay.jsonc --environment production
      - name: Provisionally deploy production intake disabled
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
        run: >-
          npx wrangler deploy --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
          --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF"
          --var "INTAKE_ENABLED:false"
          --var "INTAKE_ENABLEMENT_MODE:disabled"
      - name: Verify exact disabled provisional production intake
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          mkdir -p "$plan_dir"
          npx wrangler deployments status --config wrangler.jsonc \
            --env production --json > "$plan_dir/provisional-status.json"
          deployed_version=$(python ../scripts/validate_cloudflare_rollback.py \
            active-version --status "$plan_dir/provisional-status.json")
          npx wrangler versions view "$deployed_version" --config wrangler.jsonc \
            --env production --json > "$plan_dir/provisional-version.json"
          python ../scripts/validate_cloudflare_rollback.py component \
            --component intake --expected-commit "$EXPECTED_COMMIT" \
            --environment production --config wrangler.jsonc \
            --version "$plan_dir/provisional-version.json" \
            --version-id "$deployed_version" --require-intake-disabled
          for attempt in $(seq 1 13); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-submission-server.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == "production"
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_configured_enabled"] is False
          assert body["intake_effective_enabled"] is False
          assert body["intake_enabled"] is False
          assert body["intake_enablement_mode"] == "disabled"
          assert body["intake_lease_expires_at"] is None
          assert body["result_amendment_maintainer_api_enabled"] is False
          assert body["promotion_canary_configured_enabled"] is False
          assert body["promotion_canary_enabled"] is False
          PY
            then
              break
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "disabled provisional intake health did not converge" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Deploy disabled production replay executor and container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.replay.jsonc --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Wait for the exact production container rollout
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          python ../scripts/wait_replay_container_rollout.py
          --config wrangler.replay.jsonc
          --environment production
          --application lean-eval-replay-executor-replaysandbox-production
      - name: Deploy production GitHub broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.broker.jsonc --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"

      - name: Verify exact production broker version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          npx wrangler deployments status --config wrangler.broker.jsonc \
            --env production --json > "$plan_dir/broker-status.json"
          deployed_version=$(python ../scripts/validate_cloudflare_rollback.py \
            active-version --status "$plan_dir/broker-status.json")
          npx wrangler versions view "$deployed_version" \
            --config wrangler.broker.jsonc --env production --json \
            > "$plan_dir/broker-version.json"
          python ../scripts/validate_cloudflare_rollback.py component \
            --component broker --expected-commit "$EXPECTED_COMMIT" \
            --environment production --config wrangler.broker.jsonc \
            --version "$plan_dir/broker-version.json" --version-id "$deployed_version"

      - name: Verify exact disabled production replay dependency
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          npx wrangler deployments status --config wrangler.replay.jsonc \
            --env production --json > "$plan_dir/replay-status.json"
          deployed_version=$(python ../scripts/validate_cloudflare_rollback.py \
            active-version --status "$plan_dir/replay-status.json")
          npx wrangler versions view "$deployed_version" \
            --config wrangler.replay.jsonc --env production --json \
            > "$plan_dir/replay-version.json"
          python ../scripts/validate_cloudflare_rollback.py component \
            --component replay --expected-commit "$EXPECTED_COMMIT" \
            --environment production --config wrangler.replay.jsonc \
            --version "$plan_dir/replay-version.json" --version-id "$deployed_version"
          for attempt in $(seq 1 25); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-replay-executor.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body == {
              "status": "ok",
              "service": "lean-eval-replay-executor",
              "environment": "production",
              "deployed_commit": os.environ["EXPECTED_COMMIT"],
              "replay_enabled": False,
              "staging_acceptance_enabled": False,
              "staging_memory_limit_bytes": 12 * 1024**3,
              "production_memory_gate_bytes": 12 * 1024**3,
              "reviewed_execution_profile_digest": "fabd804359adbe7737e1db206d1877d3b923385cf2e8e95ec2b3be69a0d4c651",
              "reviewed_measurement_config_digest": "2dfc898270b83b6c99689e3f551a102c5e76636ec9f469a408498080e3e45945",
              "reviewed_vm_image_digest": "sha256:f61b6be446c3bc355c2eefddc3b376226acee89ca562e66f3b283576a32bb20b",
          }
          PY
            then
              break
            fi
            if [ "$attempt" -eq 25 ]; then
              echo "production replay dependency health did not converge" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify exact protected State before production finalization
        id: production-state
        env:
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/lean-eval-production-finalization/state-proof.json"
          curl --fail-with-body --silent --show-error --proto '=https' \
            --max-redirs 0 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${READINESS_TOKEN}" \
            --output "$proof" \
            https://lean-eval-submission-server.lean-eval.workers.dev/readyz
          commit=$(STATE_PROOF="$proof" python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["STATE_PROOF"], encoding="utf-8") as stream:
              proof = json.load(stream)
          expected = {
              "environment",
              "intake_configured_enabled",
              "intake_effective_enabled",
              "intake_enabled",
              "intake_enablement_mode",
              "intake_lease_expires_at",
              "state_branch_protected",
              "state_commit",
              "state_contract_commit",
              "state_contract_verified",
              "state_event_schema_sha256",
              "status",
          }
          if set(proof) != expected:
              raise SystemExit("production State readiness proof is not closed")
          if (
              proof["status"] != "state_writer_ready"
              or proof["environment"] != "production"
              or proof["intake_configured_enabled"] is not False
              or proof["intake_effective_enabled"] is not False
              or proof["intake_enabled"] is not False
              or proof["intake_enablement_mode"] != "disabled"
              or proof["intake_lease_expires_at"] is not None
              or proof["state_branch_protected"] is not True
              or proof["state_contract_verified"] is not True
              or proof["state_contract_commit"] != "501d237d46c7b3466a37554c1c2ceb310245a619"
              or proof["state_event_schema_sha256"] != "af753eb3aba7a82c6c5d7b153ea0a0e411df9aa94768772aa8b99d985b6d57cb"
              or re.fullmatch(r"[0-9a-f]{40}", proof["state_commit"]) is None
          ):
              raise SystemExit("production State readiness proof did not bind the reviewed contract")
          print(proof["state_commit"])
          PY
          )
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Prepare the exact Worker-enforced intake lease
        if: steps.production-intake.outputs.enabled == 'true'
        id: intake-lease
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          python ../scripts/prepare_intake_enablement_lease.py \
            --target-commit "$GITHUB_SHA" \
            --state-commit "${{ steps.production-state.outputs.commit }}" \
            --bindings-output "$plan_dir/intake-lease-bindings.env" \
            --smoke-output "$plan_dir/intake-lease-smoke.json"
          nonce=$(jq -er .nonce "$plan_dir/intake-lease-smoke.json")
          echo "::add-mask::$nonce"
          expiry=$(jq -er .expires_at "$plan_dir/intake-lease-smoke.json")
          echo "expires_at=$expiry" >> "$GITHUB_OUTPUT"

      - name: Validate the closed lease before any enabled mutation
        if: steps.production-intake.outputs.enabled == 'true'
        run: >-
          python ../scripts/validate_cloudflare_rollback.py lease-bindings
          --bindings "$RUNNER_TEMP/lean-eval-production-finalization/intake-lease-bindings.env"
          --expected-commit "$GITHUB_SHA"

      - name: Deploy the exact self-expiring production intake lease
        if: steps.production-intake.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
          INTAKE_LEASE_EXPIRES_AT: ${{ steps.intake-lease.outputs.expires_at }}
        run: |
          set -euo pipefail
          if [ "$((INTAKE_LEASE_EXPIRES_AT - $(date +%s)))" -lt 600 ]; then
            echo "Worker-enforced intake lease is too short to begin" >&2
            exit 1
          fi
          mapfile -t lease_vars < "$RUNNER_TEMP/lean-eval-production-finalization/intake-lease-bindings.env"
          arguments=()
          for binding in "${lease_vars[@]}"; do
            name=${binding%%=*}
            value=${binding#*=}
            if [ -z "$name" ] || [ "$binding" = "$name" ]; then
              echo "generated intake lease binding is malformed" >&2
              exit 1
            fi
            arguments+=(--var "$name:$value")
          done
          timeout --signal=TERM --kill-after=10s 150s npx wrangler deploy \
            --env production --var "DEPLOYED_COMMIT:$GITHUB_SHA" \
            --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF" "${arguments[@]}"

      - name: Verify and consume the exact leased intake smoke
        if: steps.production-intake.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
          INTAKE_LEASE_EXPIRES_AT: ${{ steps.intake-lease.outputs.expires_at }}
          QUALIFIED_STATE_COMMIT: ${{ steps.production-state.outputs.commit }}
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          timeout 60s npx wrangler deployments status --config wrangler.jsonc \
            --env production --json > "$plan_dir/final-status.json"
          deployed_version=$(python ../scripts/validate_cloudflare_rollback.py \
            active-version --status "$plan_dir/final-status.json")
          timeout 60s npx wrangler versions view "$deployed_version" \
            --config wrangler.jsonc --env production --json \
            > "$plan_dir/final-version.json"
          python ../scripts/validate_cloudflare_rollback.py component \
            --component intake --expected-commit "$EXPECTED_COMMIT" \
            --environment production --config wrangler.jsonc \
            --version "$plan_dir/final-version.json" --version-id "$deployed_version" \
            --intake-lease-bindings "$plan_dir/intake-lease-bindings.env"
          converged=false
          for attempt in $(seq 1 13); do
            body=$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 --max-time 10 \
              https://lean-eval-submission-server.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == "production"
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_configured_enabled"] is True
          assert body["intake_effective_enabled"] is True
          assert body["intake_enabled"] is True
          assert body["intake_enablement_mode"] == "leased"
          assert body["intake_lease_expires_at"] == int(os.environ["INTAKE_LEASE_EXPIRES_AT"])
          assert body["result_amendment_maintainer_api_enabled"] is False
          assert body["promotion_canary_configured_enabled"] is False
          assert body["promotion_canary_enabled"] is False
          PY
            then
              converged=true
              break
            fi
            if [ "$attempt" -lt 13 ]; then sleep 5; fi
          done
          if [ "$converged" != true ]; then
            echo "final intake health did not converge" >&2
            exit 1
          fi
          if [ "$((INTAKE_LEASE_EXPIRES_AT - $(date +%s)))" -lt 240 ]; then
            echo "leased smoke no longer has a safe finalization margin" >&2
            exit 1
          fi
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --max-time 20 --retry 2 --retry-all-errors --retry-max-time 45 \
            -H "Authorization: Bearer $READINESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$plan_dir/intake-lease-smoke.json" \
            https://lean-eval-submission-server.lean-eval.workers.dev/internal/v1/intake-lease-smoke \
            > "$plan_dir/intake-lease-smoke-response.json"
          state_commit=$(jq -er '
            select(.status == "lease_smoke_consumed" or .status == "lease_smoke_already_consumed") |
            select(.environment == "production") |
            select(.intake_configured_enabled == true and .intake_effective_enabled == true) |
            select(.intake_enablement_mode == "leased") | .state_commit' \
            "$plan_dir/intake-lease-smoke-response.json")
          if [[ ! "$state_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "leased smoke did not return an exact post-consumption State commit" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --proto '=https' \
            --max-redirs 0 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${READINESS_TOKEN}" \
            --output "$plan_dir/post-smoke-state-proof.json" \
            https://lean-eval-submission-server.lean-eval.workers.dev/readyz
          STATE_COMMIT="$state_commit" STATE_PROOF="$plan_dir/post-smoke-state-proof.json" python - <<'PY'
          import json
          import os

          with open(os.environ["STATE_PROOF"], encoding="utf-8") as stream:
              proof = json.load(stream)
          expected = {
              "environment", "intake_configured_enabled", "intake_effective_enabled",
              "intake_enabled", "intake_enablement_mode", "intake_lease_expires_at",
              "state_branch_protected", "state_commit", "state_contract_commit",
              "state_contract_verified", "state_event_schema_sha256", "status",
          }
          if (
              set(proof) != expected
              or proof["status"] != "state_writer_ready"
              or proof["environment"] != "production"
              or proof["intake_configured_enabled"] is not True
              or proof["intake_effective_enabled"] is not True
              or proof["intake_enabled"] is not True
              or proof["intake_enablement_mode"] != "leased"
              or proof["intake_lease_expires_at"] != int(os.environ["INTAKE_LEASE_EXPIRES_AT"])
              or proof["state_branch_protected"] is not True
              or proof["state_commit"] != os.environ["STATE_COMMIT"]
              or proof["state_contract_commit"] != "501d237d46c7b3466a37554c1c2ceb310245a619"
              or proof["state_contract_verified"] is not True
              or proof["state_event_schema_sha256"] != "af753eb3aba7a82c6c5d7b153ea0a0e411df9aa94768772aa8b99d985b6d57cb"
          ):
              raise SystemExit("protected State moved after the leased smoke proof")
          PY

      - name: Verify final disabled intake and protected State
        if: steps.production-intake.outputs.enabled == 'false'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --max-time 10 --retry 12 --retry-all-errors --retry-max-time 120 \
            https://lean-eval-submission-server.lean-eval.workers.dev/healthz)
          HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_configured_enabled"] is False
          assert body["intake_effective_enabled"] is False
          assert body["intake_enablement_mode"] == "disabled"
          assert body["intake_lease_expires_at"] is None
          assert body["result_amendment_maintainer_api_enabled"] is False
          assert body["promotion_canary_configured_enabled"] is False
          assert body["promotion_canary_enabled"] is False
          PY
          plan_dir="$RUNNER_TEMP/lean-eval-production-finalization"
          curl --fail-with-body --silent --show-error --proto '=https' \
            --max-redirs 0 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${READINESS_TOKEN}" \
            --output "$plan_dir/final-state-proof.json" \
            https://lean-eval-submission-server.lean-eval.workers.dev/readyz
          PLAN_DIR="$plan_dir" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PLAN_DIR"])
          with (root / "state-proof.json").open(encoding="utf-8") as stream:
              qualified = json.load(stream)
          with (root / "final-state-proof.json").open(encoding="utf-8") as stream:
              current = json.load(stream)
          if current != qualified:
              raise SystemExit("protected State moved after disabled finalization")
          PY

      # This must remain the last production mutation and the last step. All
      # exact-version, request-path, nonce, and State proofs happen on the
      # leased version. If this command never runs or fails before activation,
      # the active leased version becomes ineffective at its embedded expiry.
      - name: Atomically make the reviewed production intake durable
        if: steps.production-intake.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
          INTAKE_LEASE_EXPIRES_AT: ${{ steps.intake-lease.outputs.expires_at }}
        run: |
          set -euo pipefail
          if [ "$((INTAKE_LEASE_EXPIRES_AT - $(date +%s)))" -lt 180 ]; then
            echo "leased intake no longer has a safe durable-transition margin" >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 150s npx wrangler deploy \
            --env production --var "DEPLOYED_COMMIT:$GITHUB_SHA" \
            --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF" \
            --var "INTAKE_ENABLED:true" --var "INTAKE_ENABLEMENT_MODE:durable"
