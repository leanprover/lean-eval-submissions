name: Check and deploy submission Worker

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/submission.yml'
      - '.github/workflows/aws-key-adapter-staging-smoke.yml'
      - '.audit/**'
      - 'INFRASTRUCTURE.md'
      - 'scripts/**'
      - 'server/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/submission.yml'
      - '.github/workflows/aws-key-adapter-staging-smoke.yml'
      - '.audit/**'
      - 'scripts/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-worker-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node pinned to v6.5.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run types:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm run deploy:dry-run

  promote-dispatch-ref:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    environment: submission-dispatch-promotion
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.promote.outputs.ref }}
    steps:
      - name: Create or verify immutable workflow-dispatch tag
        id: promote
        env:
          APPROVAL_GUARD: ${{ secrets.DISPATCH_PROMOTION_APPROVAL_GUARD }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$APPROVAL_GUARD" =~ ^[0-9a-f]{64}$ ]]; then
            echo "reviewed dispatch-promotion environment is not configured" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow commit is not a full lowercase SHA" >&2
            exit 1
          fi
          status=$(gh api "repos/$REPOSITORY/compare/$WORKFLOW_COMMIT...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "workflow commit is not reachable from protected main" >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/contents/.github/workflows/submission.yml?ref=$WORKFLOW_COMMIT" \
            --jq .sha >/dev/null

          tag="lean-eval-dispatch/$WORKFLOW_COMMIT"
          if existing=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$WORKFLOW_COMMIT" ]; then
              echo "dispatch tag collision: $tag resolves to $existing" >&2
              exit 1
            fi
          else
            gh api "repos/$REPOSITORY/git/refs" \
              -X POST \
              -f "ref=refs/tags/$tag" \
              -f "sha=$WORKFLOW_COMMIT" >/dev/null
          fi
          resolved=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          if [ "$resolved" != "$WORKFLOW_COMMIT" ]; then
            echo "dispatch tag read-back did not resolve to the reviewed commit" >&2
            exit 1
          fi
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: promote-dispatch-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify reviewed staging replay image manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ../scripts/verify_authoritative_replay_image_reference
          --config wrangler.replay.jsonc --environment staging
      - name: Deploy staging GitHub broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.broker.jsonc --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Deploy staging replay executor and container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.replay.jsonc --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Deploy staging submission Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
        run: >-
          npx wrangler deploy --env staging
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
          --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF"
      - name: Smoke-test staging
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: staging
        run: |
          for attempt in $(seq 1 13); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-submission-server-staging.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == os.environ["EXPECTED_ENVIRONMENT"]
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_enabled"] is False
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 13 ]; then sleep 5; fi
          done
          echo "health payload did not converge: $body" >&2
          exit 1
      - name: Smoke-test disabled staging replay executor
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 25); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-replay-executor-staging.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body == {
              "status": "ok",
              "service": "lean-eval-replay-executor",
              "environment": "staging",
              "deployed_commit": os.environ["EXPECTED_COMMIT"],
              "replay_enabled": False,
              "staging_acceptance_enabled": True,
              "staging_memory_limit_bytes": 12 * 1024**3,
              "production_memory_gate_bytes": 12 * 1024**3,
              "reviewed_execution_profile_digest": "0" * 64,
              "reviewed_measurement_config_digest": "0" * 64,
              "reviewed_vm_image_digest": "sha256:" + "0" * 64,
          }
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 25 ]; then sleep 5; fi
          done
          echo "replay health payload did not converge: $body" >&2
          exit 1

  deploy-production:
    needs: [deploy-staging, promote-dispatch-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify reviewed production replay image manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ../scripts/verify_authoritative_replay_image_reference
          --config wrangler.replay.jsonc --environment production
      - name: Deploy production GitHub broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.broker.jsonc --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Deploy disabled production replay executor and container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.replay.jsonc --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Deploy production submission Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_WORKFLOW_REF: ${{ needs.promote-dispatch-ref.outputs.ref }}
        run: >-
          npx wrangler deploy --env production
          --var "DEPLOYED_COMMIT:$GITHUB_SHA"
          --var "DISPATCH_WORKFLOW_REF:$DISPATCH_WORKFLOW_REF"
      - name: Smoke-test production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: production
        run: |
          for attempt in $(seq 1 13); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-submission-server.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == os.environ["EXPECTED_ENVIRONMENT"]
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_enabled"] is False
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 13 ]; then sleep 5; fi
          done
          echo "health payload did not converge: $body" >&2
          exit 1
      - name: Smoke-test disabled production replay executor
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 25); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              https://lean-eval-replay-executor.lean-eval.workers.dev/healthz) || body=""
            if HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body == {
              "status": "ok",
              "service": "lean-eval-replay-executor",
              "environment": "production",
              "deployed_commit": os.environ["EXPECTED_COMMIT"],
              "replay_enabled": False,
              "staging_acceptance_enabled": False,
              "staging_memory_limit_bytes": 12 * 1024**3,
              "production_memory_gate_bytes": 12 * 1024**3,
              "reviewed_execution_profile_digest": "0" * 64,
              "reviewed_measurement_config_digest": "0" * 64,
              "reviewed_vm_image_digest": "sha256:" + "0" * 64,
          }
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 25 ]; then sleep 5; fi
          done
          echo "replay health payload did not converge: $body" >&2
          exit 1
