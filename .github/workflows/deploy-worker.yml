name: Check and deploy submission Worker

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'INFRASTRUCTURE.md'
      - 'server/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'INFRASTRUCTURE.md'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-worker-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node pinned to v6.5.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run types:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm run deploy:dry-run

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Deploy staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Smoke-test staging
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: staging
        run: |
          body=$(curl --fail --retry 6 --retry-all-errors --retry-delay 5 \
            https://eval-submit-staging.lean-lang.org/healthz)
          HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == os.environ["EXPECTED_ENVIRONMENT"]
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_enabled"] is False
          PY

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env production --var "DEPLOYED_COMMIT:$GITHUB_SHA"
      - name: Smoke-test production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: production
        run: |
          body=$(curl --fail --retry 6 --retry-all-errors --retry-delay 5 \
            https://eval-submit.lean-lang.org/healthz)
          HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["status"] == "ok"
          assert body["environment"] == os.environ["EXPECTED_ENVIRONMENT"]
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          assert body["intake_enabled"] is False
          PY
