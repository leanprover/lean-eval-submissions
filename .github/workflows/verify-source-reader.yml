name: Verify staging Source Reader

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-reader-preflight-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-staging
    steps:
      - name: Verify App credentials and exact private fixture installation
        env:
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${READINESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"repository":"kim-em/lean-eval-intake-fixture"}' \
            --output "$response_file" \
            https://lean-eval-submission-server-staging.lean-eval.workers.dev/internal/v1/source-reader-preflight
          RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)
          assert payload == {
              "status": "source_reader_ready",
              "environment": "staging",
              "repository": "kim-em/lean-eval-intake-fixture",
              "private": True,
          }
          print("Source Reader can read only the selected private staging fixture")
          PY
