name: Force production launch gates disabled

on:
  workflow_run:
    workflows: [Check and deploy submission Worker]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: submission-worker-main
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  authorize-manual:
    if: github.event_name == 'workflow_dispatch'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require an upstream protected-main dispatch
        working-directory: .
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = leanprover/lean-eval-submissions
          test "$EVENT_REF" = refs/heads/main

  disable-production-launch-gates:
    needs: authorize-manual
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
      needs.authorize-manual.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      # Recovery logic always comes from protected main, never the failed run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      # actions/setup-node pinned to v6.5.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - run: npm ci --ignore-scripts

      - name: Resolve the exact active production intake version
        id: active
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/launch-disable-recovery"
          if [ -e "$plan_dir" ]; then exit 1; fi
          mkdir -p "$plan_dir"
          npx wrangler deployments status --config wrangler.jsonc \
            --env production --json > "$plan_dir/intake-status.json"
          version=$(python ../scripts/validate_cloudflare_rollback.py \
            active-version --status "$plan_dir/intake-status.json")
          npx wrangler versions view "$version" --config wrangler.jsonc \
            --env production --json > "$plan_dir/intake-version.json"
          python ../scripts/validate_cloudflare_rollback.py launch-recovery-source \
            --status "$plan_dir/intake-status.json" \
            --version "$plan_dir/intake-version.json" \
            --output "$plan_dir/source.json"
          read -r commit needed < <(SOURCE="$plan_dir/source.json" python - <<'PY'
          import json
          import os

          with open(os.environ["SOURCE"], encoding="utf-8") as stream:
              source = json.load(stream)
          print(source["deployed_commit"], str(source["needed"]).lower())
          PY
          )

          # Public health is useful corroboration, but recovery must still work
          # when a partial failed deployment made the endpoint unavailable.
          health_needed=false
          if curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --max-time 10 --retry 2 --retry-all-errors --retry-max-time 30 \
            --output "$plan_dir/pre-mutation-health.json" \
            https://lean-eval-submission-server.lean-eval.workers.dev/healthz; then
            if observed=$(EXPECTED_COMMIT="$commit" HEALTH="$plan_dir/pre-mutation-health.json" \
              python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["HEALTH"], encoding="utf-8") as stream:
              body = json.load(stream)
          assert body["status"] == "ok"
          assert body["service"] == "lean-eval-submission"
          assert body["environment"] == "production"
          assert re.fullmatch(r"[0-9a-f]{40}", body["deployed_commit"])
          assert body["deployed_commit"] == os.environ["EXPECTED_COMMIT"]
          fields = (
              "intake_configured_enabled",
              "intake_effective_enabled",
              "legacy_result_owner_api_enabled",
              "result_amendment_owner_api_enabled",
              "result_amendment_maintainer_api_enabled",
              "model_identity_owner_api_enabled",
              "model_identity_maintainer_api_enabled",
              "model_identity_consolidation_api_enabled",
              "release_opt_out_api_enabled",
              "promotion_canary_configured_enabled",
              "promotion_canary_enabled",
          )
          for field in fields:
              assert type(body[field]) is bool, field
          print(str(any(body[field] for field in fields)).lower())
          PY
            ); then
              health_needed="$observed"
            else
              echo "pre-mutation health was not exact; using active version metadata" >&2
              needed=true
            fi
          else
            echo "pre-mutation health unavailable; using active version metadata" >&2
            needed=true
          fi
          if [ "$health_needed" = true ]; then needed=true; fi
          {
            echo "commit=$commit"
            echo "needed=$needed"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Derive the exact eligible controller without operator pairing
        id: controller
        env:
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_COMMIT: ${{ github.event.workflow_run.head_sha }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          LIVE_COMMIT: ${{ steps.active.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            if [[ ! "$EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
               [[ ! "$EVENT_ATTEMPT" =~ ^[1-9][0-9]*$ ]] ||
               [[ ! "$EVENT_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
               [[ ! "$EVENT_CONCLUSION" =~ ^(cancelled|failure|startup_failure|timed_out)$ ]]; then
              echo "automatic recovery trigger has no exact failed controller" >&2
              exit 1
            fi
            trigger=$(timeout 30s gh api \
              "repos/$REPOSITORY/actions/runs/$EVENT_RUN_ID/attempts/$EVENT_ATTEMPT" \
              --jq '[.id, .run_attempt, .head_sha, .path, .event, .status, (.conclusion // "")] | @tsv')
            if [ "$trigger" != "$EVENT_RUN_ID"$'\t'"$EVENT_ATTEMPT"$'\t'"$EVENT_COMMIT"$'\t.github/workflows/deploy-worker.yml\tpush\tcompleted\t'"$EVENT_CONCLUSION" ] &&
               [ "$trigger" != "$EVENT_RUN_ID"$'\t'"$EVENT_ATTEMPT"$'\t'"$EVENT_COMMIT"$'\t.github/workflows/deploy-worker.yml\tworkflow_dispatch\tcompleted\t'"$EVENT_CONCLUSION" ]; then
              echo "automatic recovery trigger read-back differs" >&2
              exit 1
            fi
            latest=$(timeout 30s gh api \
              "repos/$REPOSITORY/actions/workflows/deploy-worker.yml/runs?per_page=100" \
              --jq '.workflow_runs | max_by(.run_number) | [.id, .run_attempt, .head_sha, .status, (.conclusion // "")] | @tsv')
            IFS=$'\t' read -r latest_run_id latest_run_attempt latest_commit latest_status latest_conclusion <<< "$latest"
            latest_readback=$(timeout 30s gh api \
              "repos/$REPOSITORY/actions/runs/$latest_run_id/attempts/$latest_run_attempt" \
              --jq '[.id, .run_attempt, .head_sha, .path, .event, .status, (.conclusion // "")] | @tsv')
            if [ "$latest_readback" != "$latest_run_id"$'\t'"$latest_run_attempt"$'\t'"$latest_commit"$'\t.github/workflows/deploy-worker.yml\tpush\t'"$latest_status"$'\t'"$latest_conclusion" ] &&
               [ "$latest_readback" != "$latest_run_id"$'\t'"$latest_run_attempt"$'\t'"$latest_commit"$'\t.github/workflows/deploy-worker.yml\tworkflow_dispatch\t'"$latest_status"$'\t'"$latest_conclusion" ]; then
              echo "globally latest deployment current-attempt read-back differs" >&2
              exit 1
            fi
          fi
          controller=$(timeout 30s gh api \
            "repos/$REPOSITORY/actions/workflows/deploy-worker.yml/runs?branch=main&head_sha=$LIVE_COMMIT&per_page=100" \
            --jq '.workflow_runs | max_by(.run_number) | [.id, .run_attempt, .head_sha, .status, (.conclusion // "")] | @tsv')
          IFS=$'\t' read -r run_id run_attempt commit status conclusion <<< "$controller"
          if [ "$status" != completed ]; then
            echo "latest exact-live deploy controller is not completed" >&2
            exit 1
          fi
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]] ||
             [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]] ||
             [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$commit" != "$LIVE_COMMIT" ] ||
             [[ ! "$conclusion" =~ ^(success|cancelled|failure|startup_failure|timed_out)$ ]]; then
            echo "recovery controller identity is not an exact eligible deploy" >&2
            exit 1
          fi
          validator_args=(
            --event-name "$EVENT_NAME"
            --live-commit "$LIVE_COMMIT"
            --controller-run-id "$run_id"
            --controller-run-attempt "$run_attempt"
            --controller-commit "$commit"
            --controller-status "$status"
            --controller-conclusion "$conclusion"
          )
          if [ "$EVENT_NAME" = workflow_run ]; then
            validator_args+=(
              --latest-run-id "$latest_run_id"
              --latest-run-attempt "$latest_run_attempt"
              --latest-commit "$latest_commit"
              --latest-status "$latest_status"
              --latest-conclusion "$latest_conclusion"
              --trigger-run-id "$EVENT_RUN_ID"
              --trigger-run-attempt "$EVENT_ATTEMPT"
              --trigger-commit "$EVENT_COMMIT"
              --trigger-conclusion "$EVENT_CONCLUSION"
            )
          fi
          python ../scripts/validate_intake_recovery_controller.py "${validator_args[@]}"
          run=$(timeout 30s gh api \
            "repos/$REPOSITORY/actions/runs/$run_id/attempts/$run_attempt" \
            --jq '[.id, .run_attempt, .head_sha, .path, .event, .status, (.conclusion // "")] | @tsv')
          if [ "$run" != "$run_id"$'\t'"$run_attempt"$'\t'"$commit"$'\t.github/workflows/deploy-worker.yml\tpush\tcompleted\t'"$conclusion" ] &&
             [ "$run" != "$run_id"$'\t'"$run_attempt"$'\t'"$commit"$'\t.github/workflows/deploy-worker.yml\tworkflow_dispatch\tcompleted\t'"$conclusion" ]; then
            echo "recovery controller read-back differs" >&2
            exit 1
          fi
          main=$(timeout 30s gh api "repos/$REPOSITORY/branches/main" \
            --jq '[.commit.sha, .protected] | @tsv')
          IFS=$'\t' read -r main_commit protected <<< "$main"
          if [[ ! "$main_commit" =~ ^[0-9a-f]{40}$ ]] || [ "$protected" != true ]; then
            echo "recovery cannot prove protected main" >&2
            exit 1
          fi
          ancestry=$(timeout 30s gh api "repos/$REPOSITORY/compare/$commit...$main_commit" --jq .status)
          if [ "$ancestry" != ahead ] && [ "$ancestry" != identical ]; then
            echo "controller commit is not reachable from protected main" >&2
            exit 1
          fi
          tag=$(timeout 30s gh api \
            "repos/$REPOSITORY/git/ref/tags/lean-eval-dispatch/$commit" --jq .object.sha)
          if [ "$tag" != "$commit" ]; then
            echo "controller dispatch tag does not resolve exactly" >&2
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "run_attempt=$run_attempt"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare only the controller's exact Worker code and validate tracked state
        id: target
        env:
          TARGET_COMMIT: ${{ steps.controller.outputs.commit }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/intake-disable-recovery"
          if [ -e "$target" ]; then exit 1; fi
          git worktree add --detach "$target" "$TARGET_COMMIT"
          npm ci --ignore-scripts --prefix "$target/server"
          intake_enabled=$(python ../scripts/worker_intake_configuration.py \
            --config "$target/server/wrangler.jsonc" --environment production)
          lifecycle_enabled=$(python ../scripts/worker_lifecycle_configuration.py \
            --config "$target/server/wrangler.jsonc" --environment production)
          plan_dir="$RUNNER_TEMP/launch-disable-recovery"
          python ../scripts/validate_cloudflare_rollback.py launch-recovery-source \
            --status "$plan_dir/intake-status.json" \
            --version "$plan_dir/intake-version.json" \
            --config "$target/server/wrangler.jsonc" \
            --expected-commit "$TARGET_COMMIT" \
            --output "$plan_dir/validated-source.json"
          cmp --silent "$plan_dir/source.json" "$plan_dir/validated-source.json"
          {
            echo "intake_enabled=$intake_enabled"
            echo "lifecycle_enabled=$lifecycle_enabled"
          } >> "$GITHUB_OUTPUT"

      - name: Force the exact controller code to all-false launch mode
        if: steps.active.outputs.needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTIVE_VERSION: ${{ steps.active.outputs.version }}
          TARGET_COMMIT: ${{ steps.controller.outputs.commit }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/intake-disable-recovery/server"
          "$target/node_modules/.bin/wrangler" deployments status \
            --config "$target/wrangler.jsonc" --env production --json \
            > "$RUNNER_TEMP/launch-disable-recovery/pre-mutation-status.json"
          python ../scripts/validate_cloudflare_rollback.py status \
            --status "$RUNNER_TEMP/launch-disable-recovery/pre-mutation-status.json" \
            --target-version "$EXPECTED_ACTIVE_VERSION"
          timeout --signal=TERM --kill-after=10s 150s \
            "$target/node_modules/.bin/wrangler" deploy \
            --config "$target/wrangler.jsonc" --env production \
            --var "DEPLOYED_COMMIT:$TARGET_COMMIT" \
            --var "DISPATCH_WORKFLOW_REF:lean-eval-dispatch/$TARGET_COMMIT" \
            --var "INTAKE_ENABLED:false" \
            --var "INTAKE_ENABLEMENT_MODE:disabled" \
            --var "LEGACY_RESULT_OWNER_API_ENABLED:false" \
            --var "RESULT_AMENDMENT_OWNER_API_ENABLED:false" \
            --var "RESULT_AMENDMENT_MAINTAINER_API_ENABLED:false" \
            --var 'RESULT_AMENDMENT_MAINTAINERS:[]' \
            --var "MODEL_IDENTITY_OWNER_API_ENABLED:false" \
            --var "MODEL_IDENTITY_MAINTAINER_API_ENABLED:false" \
            --var 'MODEL_IDENTITY_MAINTAINERS:[]' \
            --var "MODEL_IDENTITY_CONSOLIDATION_API_ENABLED:false" \
            --var "RELEASE_OPT_IN_API_ENABLED:false" \
            --var "RELEASE_OPT_OUT_API_ENABLED:false" \
            --var "PROMOTION_CANARY_ENABLED:false"

      - name: Verify the exact all-false recovery version
        if: steps.active.outputs.needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_COMMIT: ${{ steps.controller.outputs.commit }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/intake-disable-recovery/server"
          "$target/node_modules/.bin/wrangler" deployments status \
            --config "$target/wrangler.jsonc" --env production --json > "$RUNNER_TEMP/recovery-status.json"
          version=$(python ../scripts/validate_cloudflare_rollback.py active-version \
            --status "$RUNNER_TEMP/recovery-status.json")
          "$target/node_modules/.bin/wrangler" versions view "$version" \
            --config "$target/wrangler.jsonc" --env production --json > "$RUNNER_TEMP/recovery-version.json"
          python ../scripts/validate_cloudflare_rollback.py component \
            --component intake --expected-commit "$TARGET_COMMIT" --environment production \
            --config "$target/wrangler.jsonc" --version "$RUNNER_TEMP/recovery-version.json" \
            --version-id "$version" --require-intake-disabled \
            --require-launch-gates-disabled
          body=$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --max-time 10 --retry 12 --retry-all-errors --retry-max-time 120 \
            https://lean-eval-submission-server.lean-eval.workers.dev/healthz)
          HEALTH_BODY="$body" python - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH_BODY"])
          assert body["deployed_commit"] == os.environ["TARGET_COMMIT"]
          assert body["intake_configured_enabled"] is False
          assert body["intake_effective_enabled"] is False
          assert body["intake_enablement_mode"] == "disabled"
          assert body["intake_lease_expires_at"] is None
          for field in (
              "legacy_result_owner_api_enabled",
              "result_amendment_owner_api_enabled",
              "result_amendment_maintainer_api_enabled",
              "model_identity_owner_api_enabled",
              "model_identity_maintainer_api_enabled",
              "model_identity_consolidation_api_enabled",
              "release_opt_out_api_enabled",
          ):
              assert body[field] is False, field
          assert body["promotion_canary_configured_enabled"] is False
          assert body["promotion_canary_enabled"] is False
          PY
